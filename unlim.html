document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ration: none; }\n  a:hover { color: #E4702B; }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"1ea0e4de-04b1-4927-ae3d-4052a8d2ab8e#/deck-stage.js\" width=\"1080\" height=\"1350\" hint-size=\"100%,100%\">\n\n  <!-- 01 — обложка -->\n  <section data-label=\"Обложка\" data-screen-label=\"01\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #0F3A2A;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(241,235,221,0.12) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; right: -220px; top: 480px; width: 940px; height: 940px; border-radius: 999px; background: radial-gradient(circle, rgba(228,112,43,0.32) 0%, rgba(228,112,43,0) 66%);\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.4; mix-blend-mode: overlay; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center;\">\n          <div style=\"display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; background: #E4702B;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 21px; letter-spacing: 0.08em; text-transform: uppercase; color: #FFF8F0;\">unlim · подписка<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.1em; color: rgba(241,235,221,0.6);\">RU / UZ / EN<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 36px;\">\n          <h2 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 86px; line-height: 1.04; letter-spacing: -0.045em; color: #F1EBDD; text-wrap: balance;\">Загрузите инвойс —<br>и увидите <span style=\"position: relative; display: inline-block; white-space: nowrap;\"><span style=\"position: absolute; left: 0; right: 0; bottom: -8px; height: 12px; background: #E4702B;\"><\u002Fspan><span style=\"position: relative;\">свою сумму.<\u002Fspan><\u002Fspan><\u002Fh2>\n          <p style=\"margin: 0; font-family: 'Golos Text', sans-serif; font-size: 34px; font-weight: 500; line-height: 1.35; color: rgba(241,235,221,0.8); max-width: 21em; text-wrap: pretty;\">Не «какая ставка по коду», а сколько заплатите вы: объём, страна, Incoterms, курс, сертификаты и льготы. С обоснованием кода и PDF со ссылками на акты.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 22px; flex-wrap: wrap;\">\n          <div style=\"display: inline-flex; align-items: baseline; gap: 14px; padding: 20px 32px; border-radius: 999px; background: rgba(241,235,221,0.12); border: 1px solid rgba(241,235,221,0.25);\">\n            <span style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 34px; color: #F1EBDD;\">77 000<\u002Fspan>\n            <span style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; color: rgba(241,235,221,0.65);\">сум / месяц<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1;\"><\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 19px; line-height: 1.4; text-align: right; color: rgba(241,235,221,0.5);\">ИП ООО «Infinity Intertrade»<br>ISO 9001:2015<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 — где справочник заканчивается -->\n  <section data-label=\"Граница справочника\" data-screen-label=\"02\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #F1EBDD;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,80,58,0.14) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.26; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #C2521A;\">01 — где справочник заканчивается<\u002Fdiv>\n\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 58px; line-height: 1.1; letter-spacing: -0.04em; color: #0F3A2A; max-width: 15em; text-wrap: balance;\">Ставка известна. Сумма — нет.<\u002Fh3>\n\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 22px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 27px; line-height: 1.35; color: #0F3A2A;\">Пошлина 5% — <b style=\"font-weight: 700;\">от какой базы?<\u002Fb> CIF, FOB или цена по инвойсу плюс фрахт?<\u002Fdiv>\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 38px; text-align: center; color: rgba(15,58,42,0.25);\">?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 22px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 27px; line-height: 1.35; color: #0F3A2A;\">Специфика «$0,6 за см³, но не менее» — <b style=\"font-weight: 700;\">что применится<\u002Fb> к вашей партии?<\u002Fdiv>\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 38px; text-align: center; color: rgba(15,58,42,0.25);\">?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 22px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 27px; line-height: 1.35; color: #0F3A2A;\">Сертификат происхождения есть — <b style=\"font-weight: 700;\">льгота сработает<\u002Fb> или нет?<\u002Fdiv>\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 38px; text-align: center; color: rgba(15,58,42,0.25);\">?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 56px; align-items: center; gap: 22px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 27px; line-height: 1.35; color: #0F3A2A;\">Из двадцати похожих подкодов — <b style=\"font-weight: 700;\">какой выдержит проверку?<\u002Fb><\u002Fdiv>\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 38px; text-align: center; color: rgba(15,58,42,0.25);\">?<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 30px 34px; border-radius: 26px; background: #0F3A2A; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.3; letter-spacing: -0.02em; color: #7BD8A0;\">Четыре вопроса, на которые справочник не отвечает. Unlim отвечает на все.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 — раздел: что даёт Unlim -->\n  <section data-label=\"Раздел · Unlim\" data-screen-label=\"03\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #0F3A2A;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(241,235,221,0.12) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; left: -200px; top: -180px; width: 900px; height: 900px; border-radius: 999px; background: radial-gradient(circle, rgba(123,216,160,0.24) 0%, rgba(123,216,160,0) 66%);\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.4; mix-blend-mode: overlay; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: center; gap: 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #7BD8A0;\">02 — что входит в подписку<\u002Fdiv>\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -0.05em; color: #F1EBDD;\">Шесть<br>возможностей<br><span style=\"color: #7BD8A0;\">по вашей поставке.<\u002Fspan><\u002Fh3>\n        <p style=\"margin: 0; font-family: 'Golos Text', sans-serif; font-size: 32px; line-height: 1.4; color: rgba(241,235,221,0.72); max-width: 22em; text-wrap: pretty;\">Дальше — каждая по отдельности: что спрашиваете, что получаете и зачем это нужно до подачи декларации.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 — расчёт партии -->\n  <section data-label=\"Расчёт партии\" data-screen-label=\"04\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #F1EBDD;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,80,58,0.14) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.26; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #C2521A;\">03 — возможность 1<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: rgba(194,82,26,0.3);\"><\u002Fdiv>\n        <\u002Fdi adding: 26px 30px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 22px; width: 44px; text-align: center; color: #14503A;\">02<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: #0F3A2A;\">Пошлина: процент, специфика за единицу или «но не менее»<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px; padding: 26px 30px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 22px; width: 44px; text-align: center; color: #14503A;\">03<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: #0F3A2A;\">Акциз — если товар подакцизный<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px; padding: 26px 30px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 22px; width: 44px; text-align: center; color: #14503A;\">04<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: #0F3A2A;\">Утильсбор по объёму двигателя и возрасту<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 22px; padding: 26px 30px; border-radius: 22px; background: #E4702B; box-shadow: 0 14px 32px -20px rgba(194,82,26,0.7);\">\n            <div style=\"flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 22px; width: 44px; text-align: center; color: rgba(255,248,240,0.9);\">05<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: #FFF8F0;\">НДС 12% — и <b style=\"font-weight: 700;\">+5%<\u002Fb>, если сертификата происхождения нет<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.45; color: rgba(15,58,42,0.6);\">Каждая строка — с формулой и номером акта, по которому она посчитана. Не «итого», а «итого, потому что».<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 — код по ОПИ -->\n  <section data-label=\"Код по ОПИ\" data-screen-label=\"05\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #0F3A2A;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(241,235,221,0.12) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; right: -240px; top: -160px; width: 820px; height: 820px; border-radius: 999px; background: radial-gradient(circle, rgba(228,112,43,0.32) 0%, rgba(228,112,43,0) 66%);\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.4; mix-blend-mode: overlay; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #F5A96E;\">04 — возможность 2<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: rgba(245,169,110,0.3);\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -0.04em; color: #F1EBDD; max-width: 15em; text-wrap: balance;\">Код, который выдержит проверку<\u002Fh3>\n\n        <p style=\"margin: 0; font-family: 'Golos Text', sans-serif; font-size: 30px; line-height: 1.4; color: rgba(241,235,221,0.8); max-width: 21em; text-wrap: pretty;\">Опишите товар словами или пришлите инвойс. В ответ — код с обоснованием по Основным правилам интерпретации, а не «похоже, подойдёт этот».<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"padding: 30px 34px; border-radius: 24px; background: rgba(241,235,221,0.08); display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 25px; color: #7BD8A0;\">Почему этот, а не соседний<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: rgba(241,235,221,0.82);\">Разбор по ОПИ 1, 3(б) и 6: какой материал определяет позицию, какая функция главная.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 30px 34px; border-radius: 24px; background: rgba(241,235,221,0.08); display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 25px; color: #7BD8A0;\">Что спросит инспектор<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: rgba(241,235,221,0.82);\">Слабые места классификации названы заранее — вместе с формулировкой ответа.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 30px 34px; border-radius: 24px; background: rgba(228,112,43,0.2); border: 1px solid rgba(228,112,43,0.5); display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 25px; color: #F5A96E;\">Разница в деньгах<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: rgba(241,235,221,0.88);\">Сколько стоит ошибка в двух знаках — на вашей партии, в сумах, а не в процентах.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 21px; line-height: 1.5; color: rgba(241,235,221,0.5);\">Классификация — вопрос обоснования, а не удачи. Обоснование должно быть письменным.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 — проверка цены -->\n  <section data-label=\"Проверка цены\" data-screen-label=\"06\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #F1EBDD;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,80,58,0.14) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.26; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #C2521A;\">05 — возможность 3<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: rgba(194,82,26,0.3);\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -0.04em; color: #0F3A2A; max-width: 15em; text-wrap: balance;\">Проверка цены до подачи декларации<\u002Fh3>\n\n        <p style=\"margin: 0; font-family: 'Golos Text', sans-serif; font-size: 29px; line-height: 1.4; color: rgba(15,58,42,0.78); max-width: 21em; text-wrap: pretty;\">Бот сравнивает вашу цену со статистикой реальных деклараций по тому же коду и стране — и говорит, где вы стоите.<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n              <span style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; color: rgba(15,58,42,0.75);\">Ваша цена<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #C2521A;\">$0,30 / кг<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height: 30px; width: 22%; border-radius: 8px; background: #E4702B;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n              <span style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; color: rgba(15,58,42,0.75);\">Медиана по коду и стране<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #14503A;\">$1,66 / кг<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height: 30px; width: 100%; border-radius: 8px; background: #14503A;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: rgba(15,58,42,0.5);\">пример: мясо птицы, импорт из третьих стран<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 20px; align-items: flex-start; padding: 28px 32px; border-radius: 24px; background: rgba(228,112,43,0.14); border: 1px solid rgba(228,112,43,0.42);\">\n          <span style=\"flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #C2521A; padding-top: 2px;\">!<\u002Fspan>\n          <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.4; color: #7A3410;\">Если разрыв большой — бот предупредит и подскажет, какими документами подтверждать стоимость. До подачи, а не после.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 07 — документы и льготы -->\n  <section data-label=\"Документы и льготы\" data-screen-label=\"07\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #F1EBDD;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,80,58,0.14) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.26; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #C2521A;\">06 — возможность 4<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: rgba(194,82,26,0.3);\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -0.04em; color: #0F3A2A; max-width: 15em; text-wrap: balance;\">Льготы, которые реально применятся<\u002Fh3>\n\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 26px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #14503A;\">СТ-1 / форма А<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.35; color: #0F3A2A;\">Есть — тарифная преференция. Нет — пошлина по общей ставке и НДС выше на 5 пунктов.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 26px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #14503A;\">Режим<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.35; color: #0F3A2A;\">Выпуск для потребления, переработка, временный ввоз, реэкспорт — платежи считаются по-разному.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 26px; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #14503A;\">Целевое<br>назначение<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.35; color: #0F3A2A;\">Оборудование для собственного производства, медизделия, вклад в УФ — освобождения по ПКМ и УП.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 26px; padding: 30px 34px; border-radius: 24px; background: #14503A;\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #7BD8A0;\">Разрешительные<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.35; color: rgba(241,235,221,0.88);\">Сертификация, СЭС, ветеринарный контроль, регистрационное удостоверение — что нужно именно вам и в какой орган идти.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.45; color: rgba(15,58,42,0.6);\">Льгота, о которой вы не знали, — это переплата. Льгота, применённая неправильно, — это доначисление.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 — уведомления -->\n  <section data-label=\"Уведомления\" data-screen-label=\"08\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #0F3A2A;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(241,235,221,0.12) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; left: -220px; bottom: -240px; width: 880px; height: 880px; border-radius: 999px; background: radial-gradient(circle, rgba(123,216,160,0.2) 0%, rgba(123,216,160,0) 66%);\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.4; mix-blend-mode: overlay; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #F5A96E;\">07 — возможность 5<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: rgba(245,169,110,0.3);\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -0.04em; color: #F1EBDD; max-width: 15em; text-wrap: balance;\">Ставка изменилась — вы узнаёте первым<\u002Fh3>\n\n        <p style=\"margin: 0; font-family: 'Golos Text', sans-serif; font-size: 29px; line-height: 1.4; color: rgba(241,235,221,0.8); max-width: 21em; text-wrap: pretty;\">Отметьте свои коды — и бот сам пришлёт сообщение, когда по ним поменяется тариф, появится новое требование или отменится льгота.<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"padding: 28px 32px; border-radius: 24px 24px 24px 6px; background: rgba(241,235,221,0.1); border: 1px solid rgba(241,235,221,0.22); display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 21px; letter-spacing: 0.06em; color: #7BD8A0;\">08.04.2026 · 09:12<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.4; color: rgba(241,235,221,0.9);\">По коду <b style=\"font-weight: 700;\">6404 11 000 0<\u002Fb> изменена ставка пошлины: 5% → 10%. Основание — ПКМ №218 от 05.04.2026.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 28px 32px; border-radius: 24px 24px 24px 6px; background: rgba(228,112,43,0.18); border: 1px solid rgba(228,112,43,0.45); display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 21px; letter-spacing: 0.06em; color: #F5A96E;\">пересчёт по вашей партии<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.4; color: rgba(241,235,221,0.9);\">Прошлая поставка обошлась бы дороже на <b style=\"font-weight: 700;\">1 240 000 сум<\u002Fb>. Проверьте контракты, где отгрузка ещё не прошла.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 21px; line-height: 1.5; color: rgba(241,235,221,0.5);\">Никто не рассылает уведомления импортёрам. Приходится узнавать самим — обычно на посту.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 09 — PDF и память профиля -->\n  <section data-label=\"PDF и профиль\" data-screen-label=\"09\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #F1EBDD;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,80,58,0.14) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; opacity: 0.26; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.9%22 sc-camel-num-octaves=%224%22/%3E%3C/filter%3E%3Crect width=%22140%22 height=%22140%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');\"><\u002Fdiv>\n\n      <div style=\"position: absolute; inset: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 34px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 20px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #C2521A;\">08 — возможность 6<\u002Fdiv>\n          <div style=\"flex: 1; height: 1px; background: rgba(194,82,26,0.3);\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.1; letter-spacing: -0.04em; color: #0F3A2A; max-width: 15em; text-wrap: balance;\">Документ, который можно переслать<\u002Fh3>\n\n        <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: flex; gap: 24px; align-items: center; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"flex: none; width: 52px; height: 52px; border-radius: 14px; background: rgba(20,80,58,0.12); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #14503A;\">⤓<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: #0F3A2A;\"><b style=\"font-weight: 700;\">PDF с расчётом и ссылками на акты<\u002Fb> — бухгалтеру для планирования платежей, брокеру для декларации, банку для валютного контроля.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 24px; align-items: center; padding: 30px 34px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 10px 26px -22px rgba(15,58,42,0.4);\">\n            <div style=\"flex: none; width: 52px; height: 52px; border-radius: 14px; background: rgba(20,80,58,0.12); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #14503A;\">◷<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: #0F3A2A;\"><b style=\"font-weight: 700;\">История расчётов<\u002Fb> хранится в чате. Вернуться к прошлой поставке и сравнить — за секунды.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 24px; align-items: center; padding: 30px 34px; border-radius: 24px; background: #14503A;\">\n            <div style=\"flex: none; width: 52px; height: 52px; border-radius: 14px; background: rgba(241,235,221,0.16); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #7BD8A0;\">☰<\u002Fdiv>\n            <div style=\"font-family: 'Golos Text', sans-serif; font-size: 26px; line-height: 1.35; color: rgba(241,235,221,0.9);\"><b style=\"font-weight: 700;\">Память профиля:<\u002Fb> ваша номенклатура, страны и обычные условия поставки. Не объясняете заново каждый раз.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'Golos Text', sans-serif; font-size: 25px; line-height: 1.45; color: rgba(15,58,42,0.6);\">Расчёт, который нельзя показать бухгалтеру, — это не расчёт, а сообщение в чате.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 — сравнение -->\n  <section data-label=\"Сравнение\" data-screen-label=\"10\" style=\"overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif;\">\n    <div style=\"position: relative; width: 100%; height: 100%; overflow: hidden; background: #F1EBDD;\">\n      <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,80,58,0.14) 1.4px, transparent 1.4px); background-size: 26px 26px;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: 0; op
