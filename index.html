y of departure and closed in Uzbekistan.\n⚠️ Common mistake: confusing TIR and CMR. CMR is the carriage contract. TIR is the customs transit document. They travel together, but they are different things.", "l": "en"}, {"t": "Bill of Lading (B/L)", "s": "DOCUMENTS", "b": "A transport document for sea carriage. It is at once: the carriage contract, the captain's receipt, and a document of title (whoever holds it owns the cargo).\n⚠️ Common mistake: not controlling whom the bill of lading is issued to. If it's to the freight forwarder — there may be problems collecting the cargo.", "l": "en"}, {"t": "Air Waybill (AWB)", "s": "DOCUMENTS", "b": "A transport document for air carriage. Unlike a bill of lading — it is not a document of title. Used for urgent, high-value or perishable cargo.", "l": "en"}, {"t": "Rail waybill (SMGS/CIM)", "s": "DOCUMENTS", "b": "A transport document for rail carriage. SMGS — for CIS countries, CIM — for European ones. The main way to deliver large batches from Russia, Kazakhstan, China.", "l": "en"}, {"t": "Export declaration of the country of departure", "s": "DOCUMENTS", "b": "A document with which the foreign seller cleared the export of the goods in their own country. It confirms: the goods legally left the country at the declared price.\n📌 In practice: Uzbek customs requests it during a value adjustment. If the price at export matches your invoice — a strong argument against the KTS.\n⚠️ Common mistake: not asking the supplier in advance. After shipment it's harder to obtain.", "l": "en"}, {"t": "Insurance policy (cargo)", "s": "DOCUMENTS", "b": "A document confirming the cargo is insured during carriage. It covers the risks of loss, damage and theft.\nUnder CIF the seller must insure the cargo — but with minimum cover (ICC C, 110% of value). If you want full cover — specify ICC A in the contract. Under EXW, FOB — you insure the cargo yourself. The insurance premium is included in the customs value.", "l": "en"}, {"t": "Certificate of origin", "s": "DOCUMENTS", "b": "A document confirming the country of origin of the goods. It gives the right to a preferential duty rate.\nST-1 → CIS countries → duty 0% or reduced\nEUR.1 → goods from the EU → reduced for certain groups\nForm A → GSP (developing countries) → reduced\nCO (Certificate of Origin) → universal, no preferences\n⚠️ Common mistake: requesting the certificate after shipment. Some types (e.g. ST-1) are issued only before or during shipment.", "l": "en"}, {"t": "ST-1", "s": "DOCUMENTS", "b": "A certificate of origin for goods from CIS countries. Gives the right to a zero or reduced duty rate. Issued by the Chamber of Commerce of the exporting country.\nCountries: Russia, Kazakhstan, Belarus, Kyrgyzstan, Tajikistan, Armenia, Azerbaijan, Moldova, Ukraine.", "l": "en"}, {"t": "Contract (foreign trade)", "s": "DOCUMENTS", "b": "The main legal document between you and your foreign partner.\nFull details of the parties\nProduct description (name, HS code, quantity, quality)\nPrice and currency\nDelivery terms (Incoterms)\nPayment terms (prepayment, letter of credit, deferral)\nWho arranges the permits\nGoverning law and dispute resolution\n⚠️ Common mistake: not stating who arranges the certificate of origin and the permits. Later it turns out nobody did.", "l": "en"}, {"t": "Contract specification", "s": "DOCUMENTS", "b": "An annex to the contract with a detailed description of each batch: names, article numbers, quantities, per-line prices. An integral part of the contract. For regular shipments it's more convenient to have a framework contract + a specification for each batch.", "l": "en"}, {"t": "Quality certificate", "s": "DOCUMENTS", "b": "A document from the manufacturer or an independent lab confirming the quality characteristics of a specific batch.\n📌 Important: don't confuse it with a conformity certificate. A quality certificate is from the manufacturer, for a batch. A conformity certificate is from an accredited body, for compliance with a technical regulation.", "l": "en"}, {"t": "Technical passport / Manual", "s": "DOCUMENTS", "b": "The manufacturer's documentation for machinery and equipment. Mandatory when importing equipment, electronics, medical devices. Must be in Russian or Uzbek — or with a notarised translation.", "l": "en"}, {"t": "Acceptance act", "s": "DOCUMENTS", "b": "A document recording the actual handover of goods from seller to buyer: date, place, condition, quantity. A signed act is proof that the goods were accepted in proper condition.\n⚠️ Common mistake: the absence of an act makes it harder to claim against the carrier or seller for shortage or damage.", "l": "en"}, {"t": "Deal passport", "s": "DOCUMENTS", "b": "Registration of a foreign-trade contract with an authorised bank. Required when the contract amount exceeds a set threshold. Without a deal passport the bank won't process a payment abroad.\n⚠️ Common mistake: paying a foreign supplier before opening a deal passport. The bank will block the payment.", "l": "en"}, {"t": "Conformity certificate", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "Confirmation that the goods comply with Uzbekistan's standards and technical requirements. Issued by an accredited body after lab testing. Without it customs won't release the goods.\n⚠️ Common mistake: starting the certificate when the cargo is already at the warehouse. Order the certificate at the same time as shipment.", "l": "en"}, {"t": "Scheme 7A", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "The most common certification scheme for importers. The certificate is issued for a specific contract, valid for 1 year. One certificate covers all shipments under that contract within the year.\nWhat's needed: HS code and product description, contract and invoice, technical documentation, samples for testing.", "l": "en"}, {"t": "Hygiene certificate", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "Permission from the sanitary authorities to import goods that contact people or the environment. Authority: State Sanitary-Epidemiological Service (sanepid.uz).\nCosmetics and perfume\nTableware and kitchenware\nChildren's goods and toys\nFood, dietary supplements\nHousehold chemicals and cleaning agents\n⚠️ In practice: often required together with a conformity certificate. Check by HS code in advance.", "l": "en"}, {"t": "Veterinary certificate", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "Permission from the veterinary service to import animals and products of animal origin. Authority: State Veterinary Service (vetgov.uz). The exporting country's veterinary certificate is mandatory — without it the cargo is turned back at the border.\nLive animals and poultry\nMeat and meat products\nFish and seafood\nMilk and dairy\nAnimal feed, hides, wool", "l": "en"}, {"t": "Phytosanitary certificate", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "Permission from the quarantine service to import plants and plant products. Authority: State Quarantine Inspection (karantin.uz). At the slightest sign of quarantine pests the cargo can be detained or destroyed.\nFresh fruit and vegetables\nSeeds and planting material\nGrain and its processing products\nCut flowers, plant raw materials", "l": "en"}, {"t": "Registration certificate (RU)", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "A special permit to import medicines and medical devices. Without an RU, customs won't release medical equipment and medicines. Time to obtain — several months. Authority: Agency for the Development of the Pharmaceutical Industry (miit.uz).\n⚠️ Common mistake: importing a medical device without an RU, planning to «sort it out later». The cargo will be seized at customs.", "l": "en"}, {"t": "Import/export license", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "A special state permit to import or export certain categories of goods. Without a license — not only will customs not release it, criminal liability is also possible. Check the list on lex.uz before signing the contract.\nImport: weapons, narcotics, dual-use goods, precious metals\nExport: strategic raw materials, antiques and cultural valuables", "l": "en"}, {"t": "Incoterms 2020", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "ICC's international rules answering three questions in any trade deal: who pays for delivery and up to which point, who bears the risk of loss or damage, who arranges documents and permits.\nFor customs: the delivery term determines the customs value. Uzbek customs calculates on a CIF basis. If the contract uses another term — it must be recalculated to CIF.", "l": "en"}, {"t": "EXW (Ex Works)", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "The seller did the minimum: prepared the goods at their own warehouse. Everything else is your concern. Your costs: loading + inland transport in the seller's country + export clearance + international carriage + insurance + delivery to your warehouse.\n📌 For customs: customs value under EXW = invoice price + ALL costs up to the UZ border.", "l": "en"}, {"t": "FOB (Free On Board)", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "The seller delivers the goods to the ship's side at the port of shipment and loads them. After loading — the risk is yours. Sea carriage only.\n📌 For customs: customs value under FOB = FOB price + freight to the UZ border + insurance. Don't forget to add freight — a common cause of value adjustments.", "l": "en"}, {"t": "CIF (Cost, Insurance, Freight)", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "The seller pays freight and insurance to the port of destination. CIF is the base term for calculating customs value in Uzbekistan. All other terms are recalculated to it.\n⚠️ In practice: under CIF the seller chooses the insurance — minimum cover by default (ICC C). If you want full cover — specify ICC A in the contract.", "l": "en"}, {"t": "DAP (Delivered At Place)", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "The seller delivers the goods to your warehouse in Uzbekistan. Customs clearance and payments are your task.\n📌 For customs: customs value under DAP = DAP price minus costs after the UZ border. Ask the forwarder for a «from the border» breakdown.", "l": "en"}, {"t": "DDP (Delivered Duty Paid)", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "The seller takes on absolutely everything: delivery, customs clearance, payment of all duties and taxes in your country. Rare in Uzbekistan.\n⚠️ Caution: under DDP you lose control over customs clearance. In a check, claims go to you as the recipient.", "l": "en"}, {"t": "Currency control", "s": "CURRENCY CONTROL & BANKING", "b": "The state's system for monitoring the movement of foreign currency. In Uzbekistan it is run by the Central Bank (cbu.uz) through authorised commercial banks. Every payment abroad and every inflow is tracked and reconciled against the contract.", "l": "en"}, {"t": "Repatriation of export proceeds", "s": "CURRENCY CONTROL & BANKING", "b": "The exporter's obligation to return foreign-currency proceeds to an account at an Uzbek bank within set deadlines.\n⚠️ Common mistake: giving a foreign buyer a long deferral without agreeing it with the bank. Repatriation deadlines are fixed — breaching them doesn't depend on the contract terms.", "l": "en"}, {"t": "Currency conversion", "s": "CURRENCY CONTROL & BANKING", "b": "Exchanging foreign currency into Uzbek sum for domestic settlements or to pay customs payments. Customs payments are paid in sum at the Central Bank rate on the declaration date. The rate changes daily.\n📌 Tip: when budgeting a shipment, allow a small reserve for the exchange-rate difference.", "l": "en"}, {"t": "Currency clause", "s": "CURRENCY CONTROL & BANKING", "b": "A contract clause protecting against exchange-rate risk. It fixes the currency in which the price is recalculated if the rate changes. Without a clause, one of the partners loses money when the rate moves.", "l": "en"}, {"t": "State Customs Committee (GTK)", "s": "ORGANIZATIONS & SOURCES", "b": "Uzbekistan's main customs authority. It accepts declarations, controls the movement of goods, and sets clearance rules. Website: customs.uz. Tariffs and codes: tarif.customs.uz.", "l": "en"}, {"t": "O'zstandart", "s": "ORGANIZATIONS & SOURCES", "b": "The Agency for Technical Regulation and Metrology. It develops standards and accredits certification bodies and testing labs. Website: standart.uz.", "l": "en"}, {"t": "O'ZAKK (accreditation centre)", "s": "ORGANIZATIONS & SOURCES", "b": "Maintains the official register of all accredited certification bodies and testing labs. Website: akkred.uz. Before approaching a body — always check its accreditation status.\n⚠️ Common mistake: working with a body without checking accreditation. If the body lost accreditation — the certificate it issued is invalid.", "l": "en"}, {"t": "Single Window", "s": "ORGANIZATIONS & SOURCES", "b": "A government portal for obtaining permits electronically. One entry — all agencies. Check whether a document is needed by HS code, file an application online, track the status — all at singlewindow.uz.", "l": "en"}, {"t": "Lex.uz", "s": "ORGANIZATIONS & SOURCES", "b": "The official database of legal acts of the Republic of Uzbekistan. Laws, government resolutions, agency orders — all in their current versions. The primary source for checking rates, exemptions, requirements and bans.", "l": "en"}, {"t": "Tarif.customs.uz", "s": "ORGANIZATIONS & SOURCES", "b": "The official SCC portal with customs duty rates, HS codes and additional notes. The first site you open when working with any product. Free, up-to-date, official.", "l": "en"}, {"t": "Авансовый платёж (предоплата)", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Часть или полная сумма оплаты, перечисляемая до поставки товара или оказания услуги. 100% предоплата выгодна экспортёру и рискованна для импортёра.", "l": "ru"}, {"t": "Авансовый платёж покупателя", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Форма коммерческого кредитования поставщика: импортёр платит часть стоимости заказа (обычно от 15%) при подписании контракта.", "l": "ru"}, {"t": "Агент", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Юридическое или физическое лицо, действующее по поручению, за счёт и от имени принципала за вознаграждение; обычно готовит сделки, но не подписывает их.", "l": "ru"}, {"t": "Агентское соглашение", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Договор между принципалом и агентом: территория работы, объём поручения, лимиты цен, размер вознаграждения, порядок отчётности и условия расторжения.", "l": "ru"}, {"t": "Аккредитив", "s": "ВАЛЮТНЫЙ КОНТРОЛЬ И БАНК", "b": "Поручение банку выплатить сумму получателю при выполнении условий аккредитива. Различают денежные и документарные, отзывные и безотзывные, подтверждённые, револьверные, переводные.", "l": "ru"}, {"t": "Акцепт", "s": "ДОКУМЕНТЫ", "b": "Согласие покупателя принять все условия твёрдой оферты без изменений.", "l": "ru"}, {"t": "Акцепт векселя", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Письменное согласие должника оплатить вексель в указанный срок, проставляемое на лицевой стороне векселя.", "l": "ru"}, {"t": "Акцепт банковский", "s": "ВАЛЮТНЫЙ КОНТРОЛЬ И БАНК", "b": "Акцепт векселя банком по просьбе импортёра; банк принимает на себя обязательство оплаты, за что взимает комиссию. Повышает надёжность векселя.", "l": "ru"}, {"t": "Антидемпинговое регулирование", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Нормы, направленные против продажи импортных товаров по ценам ниже цен внутреннего рынка страны происхождения; основа — статья VI ГАТТ и антидемпинговое соглашение ВТО.", "l": "ru"}, {"t": "Арбитраж", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Разрешение имущественных споров третейским (арбитражным) судом в порядке, предусмотренном законом или арбитражной оговоркой контракта.", "l": "ru"}, {"t": "Арест груза", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Мера, применяемая при нарушении таможенных правил — например, при недостоверных сведениях о количестве, маркировке или стране происхождения товара.", "l": "ru"}, {"t": "Аренда", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Передача имущества во временное пользование за плату; право собственности остаётся у арендодателя, по окончании срока возможен выкуп.", "l": "ru"}, {"t": "Базисные условия поставки", "s": "УСЛОВИЯ ПОСТАВКИ INCOTERMS 2020", "b": "Условия контракта, распределяющие между продавцом и покупателем расходы по доставке и момент перехода рисков утраты или повреждения товара.", "l": "ru"}, {"t": "Балк (навалом, in bulk)", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Способ перевозки груза без упаковки и контейнеров — навалом или насыпью в транспортном средстве.", "l": "ru"}, {"t": "Бартерная сделка", "s": "ВАЛЮТНЫЙ КОНТРОЛЬ И БАНК", "b": "Внешнеторговый обмен товарами равной стоимости без денежных расчётов; может быть двусторонней или многосторонней.", "l": "ru"}, {"t": "Бондовый (таможенный) груз", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Импортный товар, хранящийся на таможенном складе, по которому пошлины и налоги ещё не уплачены.", "l": "ru"}, {"t": "Брокер", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Посредник при заключении торговых и транспортных сделок, получающий комиссию за подбор контрагента и оформление договора.", "l": "ru"}, {"t": "Таможенный брокер (таможенный представитель)", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Компания, которая по поручению декларанта оформляет таможенные документы и сопровождает уплату платежей и прохождение процедур.", "l": "ru"}, {"t": "Валюта платежа", "s": "ВАЛЮТНЫЙ КОНТРОЛЬ И БАНК", "b": "Валюта, в которой производится расчёт за товар; может не совпадать с валютой цены — тогда в контракте фиксируется курс пересчёта.", "l": "ru"}, {"t": "Вексель", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Письменное долговое обязательство установленной формы, дающее право требовать уплаты указанной суммы в срок. Бывает простым и переводным (тратта), передаётся по индоссаменту.", "l": "ru"}, {"t": "Вес брутто", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Масса товара вместе с внутренней и внешней упаковкой.", "l": "ru"}, {"t": "Вес нетто", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Масса товара без упаковки. Используется при расчёте индекса таможенной стоимости и специфических пошлин.", "l": "ru"}, {"t": "Санитарно-эпидемиологическое заключение", "s": "РАЗРЕШИТЕЛЬНЫЕ ДОКУМЕНТЫ", "b": "Документ, подтверждающий безопасность продукции для здоровья человека; запрашивается при ввозе пищевых продуктов, растительного сырья и др.", "l": "ru"}, {"t": "Карантинный (фитосанитарный) сертификат", "s": "РАЗРЕШИТЕЛЬНЫЕ ДОКУМЕНТЫ", "b": "Документ о том, что растительная продукция не заражена вредителями и болезнями и происходит из благополучного района.", "l": "ru"}, {"t": "Выпуск товара", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Разрешение таможенного органа пользоваться и распоряжаться товаром в соответствии с заявленной таможенной процедурой после завершения оформления.", "l": "ru"}, {"t": "Выпуск для свободного обращения", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура, при которой ввезённый товар остаётся на территории страны без обязательства обратного вывоза, после уплаты платежей и соблюдения запретов и ограничений.", "l": "ru"}, {"t": "ВЭД (внешнеэкономическая деятельность)", "s": "СЛОВАРЬ ВЭД", "b": "Совокупность внешнеторговых, инвестиционных и иных операций компании на зарубежных рынках: обмен товарами, услугами, работами, информацией и правами на результаты интеллектуальной деятельности.", "l": "ru"}, {"t": "Гарантийное обязательство", "s": "ДОКУМЕНТЫ", "b": "Документ поставщика, подтверждающий соответствие поставленного товара (чаще оборудования) условиям контракта и работоспособность при правильной эксплуатации.", "l": "ru"}, {"t": "Банковская гарантия (гарантийное письмо)", "s": "ВАЛЮТНЫЙ КОНТРОЛЬ И БАНК", "b": "Обязательство банка-гаранта выплатить кредитору сумму, причитающуюся с должника, при неисполнении им обязательств.", "l": "ru"}, {"t": "Груз", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Товар в процессе перевозки. По транспортной характеристике делится на генеральные, навалочные, наливные, скоропортящиеся, опасные; от типа груза зависят тара, техника перевозки и тариф.", "l": "ru"}, {"t": "Де я на другие валюты без ограничений по текущим операциям; используется в расчётах по внешнеторговым контрактам.", "l": "ru"}, {"t": "Спецификация", "s": "ДОКУМЕНТЫ", "b": "Приложение к контракту или счёту с перечнем товаров по видам, сортам, размерам, количеству и ценам.", "l": "ru"}, {"t": "Страхование", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Защита имущественных интересов за счёт страховых взносов: при наступлении оговорённого события страховщик возмещает убыток.", "l": "ru"}, {"t": "Страхование экспортно-импортных грузов (карго)", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Страхование груза на период перевозки и перевалки от повреждения, утраты и недостачи. Условия страхования и сторона, оплачивающая его, определяются базисом поставки.", "l": "ru"}, {"t": "Счёт", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Платёжный документ продавца с суммой к оплате, реквизитами сторон и условиями платежа.", "l": "ru"}, {"t": "Счёт-фактура", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Документ, выписываемый после отгрузки, с описанием товара, ценой, суммой и условиями поставки; служит основанием для оплаты и таможенной оценки.", "l": "ru"}, {"t": "Счёт-спецификация", "s": "ДОКУМЕНТЫ", "b": "Документ, объединяющий данные счёта и спецификации: перечень позиций с ценами по каждой позиции.", "l": "ru"}, {"t": "Предварительный счёт (проформа-инвойс)", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Счёт, выставляемый до окончательного расчёта — для предоплаты, оформления разрешений или подтверждения условий сделки.", "l": "ru"}, {"t": "Открытый счёт", "s": "ВАЛЮТНЫЙ КОНТРОЛЬ И БАНК", "b": "Форма расчётов, при которой поставки идут без обеспечения, а задолженность периодически погашается; применяется между постоянными партнёрами с высоким доверием.", "l": "ru"}, {"t": "Сыпучие грузы", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Однородные грузы (зерно, цемент, удобрения, руда), перевозимые без упаковки насыпью в вагонах, контейнерах или автотранспорте.", "l": "ru"}, {"t": "Таможенная процедура (таможенный режим)", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Совокупность требований и условий пользования и распоряжения товарами на таможенной территории или за её пределами; определяет порядок уплаты платежей и применения запретов и ограничений.", "l": "ru"}, {"t": "Экспорт", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура вывоза товара за пределы таможенной территории на постоянной основе, без обязательства обратного ввоза.", "l": "ru"}, {"t": "Таможенный транзит", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Перевозка товара под таможенным контролем от одного таможенного органа к другому без уплаты пошлин и налогов. Ключевая процедура для Узбекистана как страны без выхода к морю.", "l": "ru"}, {"t": "Таможенный склад", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Процедура хранения ввезённых товаров под таможенным контролем без уплаты пошлин и налогов в течение установленного срока.", "l": "ru"}, {"t": "Переработка на таможенной территории", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура, при которой ввезённое сырьё перерабатывается внутри страны с условным освобождением от платежей, а продукты переработки вывозятся.", "l": "ru"}, {"t": "Переработка вне таможенной территории", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Вывоз товара для переработки за границей с последующим ввозом продуктов переработки на льготных условиях.", "l": "ru"}, {"t": "Переработка для внутреннего потребления", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Переработка ввезённого товара на территории страны с последующим выпуском продуктов переработки в свободное обращение с уплатой платежей по ставкам для готовой продукции.", "l": "ru"}, {"t": "Временный ввоз (допуск)", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура ввоза товара на определённый срок с полным или частичным освобождением от платежей и обязательством вывоза в неизменном состоянии.", "l": "ru"}, {"t": "Временный вывоз", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Вывоз товара на срок с обязательством обратного ввоза в неизменном состоянии (с учётом естественного износа).", "l": "ru"}, {"t": "Реимпорт", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Возврат ранее вывезенного товара на таможенную территорию без уплаты пошлин и налогов при соблюдении установленных условий и сроков.", "l": "ru"}, {"t": "Реэкспорт", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Вывоз ранее ввезённого товара за пределы таможенной территории, в том числе с возвратом уплаченных платежей при соблюдении условий.", "l": "ru"}, {"t": "Беспошлинная торговля", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура реализации товаров в магазинах duty free без уплаты пошлин и налогов лицам, выезжающим за пределы страны.", "l": "ru"}, {"t": "Уничтожение", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура приведения товара в состояние, при котором он утрачивает потребительские свойства, без уплаты платежей; расходы несёт декларант.", "l": "ru"}, {"t": "Отказ в пользу государства", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура безвозмездной передачи товара в государственную собственность без уплаты платежей.", "l": "ru"}, {"t": "Свободная таможенная зона / свободный склад", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура размещения и использования товаров на территории СЭЗ или свободного склада без уплаты пошлин и налогов и без применения мер нетарифного регулирования.", "l": "ru"}, {"t": "Специальная таможенная процедура", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Процедура для отдельных категорий товаров (гуманитарная помощь, дипломатические грузы, припасы и др.) с особым порядком перемещения.", "l": "ru"}, {"t": "Таможенное оформление (очистка)", "s": "ТАМОЖЕННЫЕ ПРОЦЕДУРЫ И РЕЖИМЫ", "b": "Комплекс действий по помещению товара под таможенную процедуру: декларирование, контроль документов, досмотр, уплата платежей и выпуск.", "l": "ru"}, {"t": "Таможенные пошлины", "s": "ТАМОЖЕННЫЕ ПЛАТЕЖИ", "b": "Обязательные платежи, взимаемые при ввозе или вывозе товара по ставкам тарифа. Бывают ад валорем (в процентах от стоимости), специфическими (за единицу) и комбинированными.", "l": "ru"}, {"t": "Фура", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Большегрузный автомобиль с полуприцепом для международных перевозок; стандартная вместимость около 82–92 м³ и до 20–22 т груза.", "l": "ru"}, {"t": "Фрахт", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Плата перевозчику за доставку груза; условия и момент оплаты (в пункте отправления или назначения) фиксируются в договоре перевозки.", "l": "ru"}, {"t": "Фрахтовая ставка", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Цена перевозки за единицу груза, вес, объём или контейнер; зависит от направления, вида груза и конъюнктуры рынка перевозок.", "l": "ru"}, {"t": "Чартер", "s": "ЛОГИСТИКА И ПЕРЕВОЗКА", "b": "Договор фрахтования транспортного средства (судна, вагонов, воздушного судна) целиком или частично для перевозки конкретной партии груза.", "l": "ru"}, {"t": "Цена контракта", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Согласованная сторонами стоимость товара с указанием валюты, базиса поставки и того, что в неё включено. Бывает твёрдой, с последующей фиксацией или скользящей.", "l": "ru"}, {"t": "Скользящая цена", "s": "КОММЕРЦИЯ И ПРАВО", "b": "Цена, пересчитываемая на момент исполнения контракта по формуле с учётом изменения стоимости материалов и рабочей силы; применяется при длительных поставках и оборудовании.", "l": "ru"}, {"t": "Экспортная лицензия", "s": "РАЗРЕШИТЕЛЬНЫЕ ДОКУМЕНТЫ", "b": "Разрешение уполномоченного органа на вывоз товаров, включённых в перечень лицензируемых; выдаётся на партию или на период.", "l": "ru"}, {"t": "Экспортные документы", "s": "ДОКУМЕНТЫ", "b": "Комплект документов для вывоза: контракт, инвойс, упаковочный лист, транспортный документ, сертификат происхождения, разрешительные документы и декларация.", "l": "ru"}, {"t": "Avans toʻlovi (oldindan toʻlov)", "s": "BOJXONA TO'LOVLARI", "b": "Tovar yetkazib berilgunga yoki xizmat koʻrsatilgunga qadar oʻtkaziladigan toʻlovning qismi yoki toʻliq summasi. 100% oldindan toʻlov eksport qiluvchi uchun foydali va import qiluvchi uchun z"}, {"t": "Veksel", "s": "BOJXONA TO'LOVLARI", "b": "Belgilangan shakldagi yozma qarz majburiyati boʻlib, koʻrsatilgan summani muddatida toʻlashni talab qilish huquqini beradi. Oddiy va oʻtkazma (tratta) boʻladi, indossament orqali oʻtkaziladi.", "l": "uz"}, {"t": "Brutto vazni", "s": "LOGISTIKA VA TASHISH", "b": "Tovarning ichki va tashqi qadoq bilan birgalikdagi massasi.", "l": "uz"}, {"t": "Netto vazni", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarning qadoqsiz massasi. Bojxona qiymati indeksi va spetsifik bojlarni hisoblashda foydalaniladi.", "l": "uz"}, {"t": "Sanitariya-epidemiologiya xulosasi", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Mahsulotning inson salomatligi uchun xavfsizligini tasdiqlovchi hujjat; oziq-ovqat mahsulotlari, oʻsimlik xomashyosi va boshqalarni olib kirishda talab qilinadi.", "l": "uz"}, {"t": "Karantin (fitosanitariya) sertifikati", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Oʻsimlik mahsuloti zararkunandalar va kasalliklar bilan zararlanmaganligi hamda xavfsiz hududdan kelib chiqqanligini tasdiqlovchi hujjat.", "l": "uz"}, {"t": "Tovarni chiqarish", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Rasmiylashtirish yakunlangandan soʻng, deklaratsiya qilingan bojxona protsedurasiga muvofiq tovardan foydalanish va uni tasarruf etishga bojxona organining ruxsati.", "l": "uz"}, {"t": "Erkin muomalaga chiqarish", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Toʻlovlar toʻlangan hamda taqiq va cheklovlarga rioya qilingandan soʻng, olib kirilgan tovar qayta olib chiqish majburiyatisiz mamlakat hududida qoladigan protsedura.", "l": "uz"}, {"t": "TIF (tashqi iqtisodiy faoliyat)", "s": "TIF LUG'ATI", "b": "Kompaniyaning xorijiy bozorlardagi tashqi savdo, investitsiya va boshqa operatsiyalari majmuasi: tovarlar, xizmatlar, ishlar, axborot hamda intellektual faoliyat natijalariga boʻlgan huquqlar almashinuvi.", "l": "uz"}, {"t": "Kafolat majburiyati", "s": "HUJJATLAR", "b": "Yetkazib berilgan tovarning (koʻpincha jihozlarning) shartnoma shartlariga muvofiqligini va toʻgʻri foydalanilganda ishga yaroqliligini tasdiqlovchi yetkazib beruvchi hujjati.", "l": "uz"}, {"t": "Bank kafolati (kafolat xati)", "s": "VALYUTA NAZORATI VA BANK", "b": "Qarzdor oʻz majburiyatlarini bajarmagan taqdirda, kafolat beruvchi bankning kreditorga qarzdordan undirilishi lozim boʻlgan summani toʻlash majburiyati.", "l": "uz"}, {"t": "Yuk", "s": "LOGISTIKA VA TASHISH", "b": "Tashish jarayonidagi tovar. Transport tavsifiga koʻra umumiy, quyma, suyuq, tez buziladigan va xavfli turlarga boʻlinadi; idish, tashish texnikasi va tarif yuk turiga bogʻliq.", "l": "uz"}, {"t": "Muvofiqlik deklaratsiyasi", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Deklarant mahsulotning standartlar va texnik reglamentlarning majburiy talablariga muvofiqligini tasdiqlaydigan hujjat; sertifikatlashtirish boʻyicha vakolatli organda roʻyxatdan oʻtkazilishi lozim.", "l": "uz"}, {"t": "Bojxona deklaratsiyasi", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Deklarantning bojxonaga belgilangan shakldagi tovar toʻgʻrisidagi maʼlumotlarni bildirishi: TIF TN kodi, tavsifi, ogʻirligi, qiymati, kelib chiqish mamlakati, transport, olib kirish yoki olib chiqish maqsadi, ilova qilinadigan hujjatlar roʻyxati.", "l": "uz"}, {"t": "Bojxona deklaratsiyasi (deklaratsiyalash)", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Deklarant yoki bojxona vakili tomonidan tovar toʻgʻrisidagi maʼlumotlarni va tanlangan bojxona protsedurasini taqdim etish; koʻpchilik hollarda elektron shaklda amalga oshiriladi.", "l": "uz"}, {"t": "Deklarant", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni deklaratsiya qiladigan yoki nomidan tovar deklaratsiya qilinadigan hamda bayon etilgan maʼlumotlarning haqqoniyligi uchun javobgar boʻlgan shaxs.", "l": "uz"}, {"t": "Tranzit deklaratsiyasi", "s": "LOGISTIKA VA TASHISH", "b": "Bir bojxona organidan boshqasiga bojxona tranziti protsedurasi boʻyicha olib oʻtiladigan tovarlarga rasmiylashtiriladigan deklaratsiya.", "l": "uz"}, {"t": "Yoʻlovchi bojxona deklaratsiyasi", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Jismoniy shaxslar tomonidan chegara orqali bojsiz olib kirish meʼyorlaridan ortiq yoki majburiy deklaratsiya qilinishi lozim boʻlgan tovarlar uchun deklaratsiya.", "l": "uz"}, {"t": "Demping", "s": "TIJORAT VA HUQUQ", "b": "Tovarni kelib chiqish mamlakatining ichki bozoridagi normal qiymatidan past narxda eksport qilish; ortiqcha miqdor demping farqi deb ataladi.", "l": "uz"}, {"t": "Valyuta dempingi", "s": "TIJORAT VA HUQUQ", "b": "Milliy valyutaning tashqi va ichki bozorda qadrsizlanishi oʻrtasidagi farq hisobiga past narxlarda eksport qilish.", "l": "uz"}, {"t": "Kafolat depoziti", "s": "BOJXONA TO'LOVLARI", "b": "Ishtirokchi tomonidan mumkin boʻlgan majburiyatlarni qoplash uchun bitim yoki shartnoma boʻyicha kiritiladigan pul taʼminoti.", "l": "uz"}, {"t": "Ixtiyoriy eksport cheklovlari", "s": "TIJORAT VA HUQUQ", "b": "Import qiluvchi mamlakat import kvotalarini joriy etish oʻrniga eksport qiluvchidan muayyan tovarlarni chiqarishni mustaqil ravishda cheklashiga erishadigan holat.", "l": "uz"}, {"t": "Texnik hujjatlar", "s": "HUJJATLAR", "b": "Uskuna va texnika uchun hujjatlar toʻplami: pasport, montaj va foydalanish boʻyicha yoʻriqnomalar, sxemalar, chizmalar, ehtiyot qismlar roʻyxati. Roʻyxat va til shartnomada belgilanadi.", "l": "uz"}, {"t": "Demeredj", "s": "LOGISTIKA VA TASHISH", "b": "Transport vositasi yoki konteynerning yuklash-tushirish ostida meʼyordan ortiq turib qolgani uchun toʻlov, kechikkan har bir sutka uchun hisoblanadi.", "l": "uz"}, {"t": "Meʼyordan ortiq saqlash (storidj)", "s": "LOGISTIKA VA TASHISH", "b": "Terminal yoki portning yukni bepul davrdan ortiq saqlagani uchun toʻlovi.", "l": "uz"}, {"t": "Buyurtma", "s": "HUJJATLAR", "b": "Xaridorning tovarni tayyorlash yoki ishlab chiqarish shartlari hamda kelgusi bitimning muhim elementlari koʻrsatilgan tijorat hujjati.", "l": "uz"}, {"t": "Bojxona qiymati indeksi (BQI)", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarning bir kilogramm narxi AQSh dollarida — bojxona qiymatining sof vaznga nisbati. Bojxona tomonidan eʼlon qilingan qiymatni tekshirishda nazorat mezoni sifatida foydalaniladi.", "l": "uz"}, {"t": "Incoterms", "s": "YETKAZIB BERISH SHARTLARI INCOTERMS 2020", "b": "Yetkazib berish bazislarini (uch harfli terminlar) talqin qilishning xalqaro qoidalari toʻplami boʻlib, sotuvchi va xaridor oʻrtasida xarajatlarni, rasmiylashtirish majburiyatlarini va risklarning oʻtishini taqsimlaydi. Amaldagi tahriri — Incoterms 2020.", "l": "uz"}, {"t": "Narx indekslari", "s": "TIJORAT VA HUQUQ", "b": "Narxlar oʻrtacha darajasining nisbiy oʻzgarish koʻrsatkichlari — ulgurji, chakana, eksport, import va boshqalar.", "l": "uz"}, {"t": "Injiniring", "s": "TIJORAT VA HUQUQ", "b": "Muhandislik-maslahat xizmatlari: loyihalash, texnik-iqtisodiy asoslashlar, shef-montaj, obyektni ishga tushirish, foydalanish ustidan nazorat.", "l": "uz"}, {"t": "Inkasso", "s": "VALYUTA NAZORATI VA BANK", "b": "Hisob-kitob shakli boʻlib, unda bank eksportyor topshirigʻiga koʻra importyordan toʻlovni oladi. Toza (toʻlov hujjatlari boʻyicha) va hujjatli (tovar hujjatlarini topshirishga qarshi) inkasso farqlanadi.", "l": "uz"}, {"t": "TIF TN kodi", "s": "TN VED VA TOVARLARNI TASNIFLASH", "b": "Tashqi iqtisodiy faoliyat tovar nomenklaturasining oʻn xonali kodi boʻlib, u boj va soliq stavkalarini, notarif tartibga solish choralarini hamda zarur ruxsat beruvchi hujjatlar roʻyxatini belgilaydi.", "l": "uz"}, {"t": "Toʻgʻridan-toʻgʻri konosament", "s": "LOGISTIKA VA TASHISH", "b": "Bir necha tashuvchi yoki transport turlari ishtirokidagi tashishni yakuniy nuqtagacha qamrab oluvchi konosament — Oʻzbekistonga dengiz portlari orqali keyingi temir yoʻl yoki avtomobil yetkazib berish bilan yetkazishda dolzarbdir.", "l": "uz"}, {"t": "Ombor kvitansiyasi", "s": "LOGISTIKA VA TASHISH", "b": "Ombor tomonidan yukni maʼlum muddatga toʻlov evaziga saqlashga qabul qilingani haqidagi tilxat; egasiga yoki oʻtkazish yozuvi boʻyicha shaxsga tovarni olish huquqini tasdiqlaydi.", "l": "uz"}, {"t": "Varrant (garov guvohnomasi)", "s": "LOGISTIKA VA TASHISH", "b": "Ikki qismli ombor guvohnomasining bir qismi boʻlib, uning ostida berilgan qarz miqdorida tovarga huquq beradi; tovarni berish uchun ikkala guvohnoma ham taqdim etiladi.", "l": "uz"}, {"t": "Kliring", "s": "VALYUTA NAZORATI VA BANK", "b": "Oʻzaro talab va majburiyatlarni hisobga olish asosida naqd pulsiz hisob-kitob tizimi; xalqaro hisob-kitoblarda davlatlararo kliring bitimlari bilan rasmiylashtiriladi.", "l": "uz"}, {"t": "Kovernot", "s": "LOGISTIKA VA TASHISH", "b": "Sugʻurtalovchi yoki brokerning sugʻurtalanuvchiga sugʻurta uning koʻrsatmalariga muvofiq rasmiylashtirilgani haqida xabar beruvchi hujjati.", "l": "uz"}, {"t": "Raqobatbardoshlik", "s": "TIJORAT VA HUQUQ", "b": "Tovarning raqobatchilarga nisbatan ehtiyojni qondirish darajasi va unga sarflangan xarajatlar boʻyicha tavsifi; muayyan bozorda sotish imkoniyatlarini belgilaydi.", "l": "uz"}, {"t": "Oldi-sotdi shartnomasi", "s": "HUJJATLAR", "b": "Bitimning asosiy tijorat hujjati: eksportyor va importyor tomonidan imzolangan tovar hamda unga hamroh xizmatlarni yetkazib berish shartnomasi.", "l": "uz"}, {"t": "Namunaviy shartnoma", "s": "HUJJATLAR", "b": "Oldindan tayyorlangan va aniq bitimga moslashtiriladigan unifikatsiyalangan shartlarga ega taxminiy shartnoma.", "l": "uz"}, {"t": "Tovar bozori konʼyunkturasi", "s": "TIJORAT VA HUQUQ", "b": "Iqtisodiy, ijtimoiy va tabiiy omillar taʼsiridagi bozorning joriy holati; narxlarni, kontragentlarni tanlashni va bozorga chiqish momentini belgilaydi.", "l": "uz"}, {"t": "Lizing", "s": "TIJORAT VA HUQUQ", "b": "Lizing kompaniyasi tomonidan moliyalashtiriladigan uskuna va transportning uzoq muddatli ijarasi; kompaniya ishlab chiqaruvchi bilan ijarachi oʻrtasida vositachi sifatida chiqadi.", "l": "uz"}, {"t": "Litsenziya (tashqi savdo)", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Vakolatli organning ayrim tovarlarni eksport yoki import qilishga ruxsati; ariza asosida, muayyan muddatga, mamlakat, tovar va hajm koʻrsatilgan holda beriladi.", "l": "uz"}, {"t": "Litsenziya kelishuvi", "s": "TIJORAT VA HUQUQ", "b": "Huquq egasi litsenziatga patent, nou-xau, namuna yoki tovar belgisidan foydalanishga ruxsat beradigan shartnoma. Mukofot — paushal toʻlov va (yoki) royalti.", "l": "uz"}, {"t": "Yuk markirovkasi", "s": "LOGISTIKA VA TASHISH", "b": "Tovar, tara, qadoq yoki yorliqlardagi yozuvlar, belgilar va maʼlumotlar. Turlari: tovar, joʻnatuvchi, maxsus (manipulyatsion belgilar), transport markirovkasi.", "l": "uz"}, {"t": "Notarif tartibga solish choralari", "s": "TIJORAT VA HUQUQ", "b": "Noiqtisodiy va iqtisodiy tavsifga ega taqiq va cheklovlar: kvotalash, litsenziyalash, sertifikatlash, sanitariya, veterinariya va fitosanitariya nazorati, maxsus himoya choralari, valyuta nazorati.", "l": "uz"}, {"t": "Bojxona qiymatini aniqlash usullari", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "GATT/JST tamoyillari asosida ketma-ket qoʻllaniladigan oltita usul: olib kirilayotgan tovarlar bilan tuzilgan bitim narxi boʻyicha, identik tovarlar bilan tuzilgan bitim narxi boʻyicha, bir jinsli tovarlar boʻyicha, ayirish usuli, qoʻshish usuli va zaxira usuli.", "l": "uz"}, {"t": "Multimodal tashish", "s": "LOGISTIKA VA TASHISH", "b": "Yukni bitta shartnoma boʻyicha bir necha tur transportdan ketma-ket foydalanib va terminallarda qayta ortish orqali yetkazib berish. Oʻzbekistonga yetkazib berishning asosiy formati.", "l": "uz"}, {"t": "Marja", "s": "TIJORAT VA HUQUQ", "b": "Koʻrsatkichlar — stavkalar, kurslar yoki narxlar oʻrtasidagi farq; bank amaliyotida mablagʻlarni jalb qilish va joylashtirish stavkalari oʻrtasidagi farq.", "l": "uz"}, {"t": "Marketing", "s": "TIJORAT VA HUQUQ", "b": "Bozorni oʻrganish hamda talabni hisobga olgan holda ishlab chiqarish va sotishni tashkil etish: assortiment, narxlar, reklama, sotishni ragʻbatlantirish, savdo va xizmatni boshqarish.", "l": "uz"}, {"t": "Temir yoʻl yuk xati (SMGS)", "s": "LOGISTIKA VA TASHISH", "b": "Temir yoʻl orqali xalqaro tashishda transport hujjati; joʻnatuvchi tomonidan rasmiylashtiriladi, tashish shartnomasini tasdiqlaydi. Oʻzbekiston importi va eksporti uchun asosiy hujjat.", "l": "uz"}, {"t": "Nou-xau", "s": "TIJORAT VA HUQUQ", "b": "Patentlanmagan texnik, ishlab chiqarish va tijorat bilimlari va tajribasi boʻlib, shartnoma boʻyicha uzatiladi va maxfiylik rejimi bilan himoyalanadi.", "l": "uz"}, {"t": "Notis (tayyorlik haqida xabarnoma)", "s": "LOGISTIKA VA TASHISH", "b": "Tovarning joʻnatishga yoki transport vositasining yuk operatsiyalariga tayyorligi haqida belgilangan muddatda yuboriladigan xabarnoma.", "l": "uz"}, {"t": "Xavfli yuklar", "s": "LOGISTIKA VA TASHISH", "b": "Tashish paytida odamlarga, mol-mulkka va atrof-muhitga zarar yetkazishi mumkin boʻlgan moddalar va buyumlar; tasniflash, maxsus qadoqlash, markirovka va ruxsatnomalarni talab qiladi (ADR, RID, IATA DGR).", "l": "uz"}, {"t": "«Eshikdan eshikkacha» yetkazib berish", "s": "LOGISTIKA VA TASHISH", "b": "Ekspeditor joʻnatuvchi omboridan qabul qiluvchi omborigacha yukning butun yoʻlini, shu jumladan qayta yuklashlar va rasmiylashtirishni tashkil qiladigan kompleks xizmat.", "l": "uz"}, {"t": "Yukni qoʻriqlash", "s": "LOGISTIKA VA TASHISH", "b": "Yukni yoʻlda va terminallarda oʻgʻirlash hamda shikastlanishdan saqlash boʻyicha chora-tadbirlar, shu jumladan kuzatib borish va plombalash.", "l": "uz"}, {"t": "Yuk joʻnatish topshirigʻi", "s": "LOGISTIKA VA TASHISH", "b": "Xaridor yoki ekspeditorning yukni joʻnatish boʻyicha koʻrsatmalari boʻlgan hujjat: marshrut, transport, hujjatlar, qabul qiluvchi rekvizitlari.", "l": "uz"}, {"t": "Oferta", "s": "HUJJATLAR", "b": "Sotuvchining bitim tuzish boʻyicha yozma taklifi boʻlib, unda tovar, miqdor, narx va yetkazib berish shartlari koʻrsatiladi.", "l": "uz"}, {"t": "Qatʼiy oferta", "s": "HUJJATLAR", "b": "Bir xaridorga yoʻnaltirilgan, amal qilish muddati koʻrsatilgan taklif boʻlib, shu muddat davomida sotuvchi oʻz taklifi bilan bogʻlangan boʻladi.", "l": "uz"}, {"t": "Erkin oferta", "s": "HUJJATLAR", "b": "Majburiyatsiz, bir necha xaridorga yoʻnaltiriladigan taklif; bitim faqat sotuvchi tomonidan tasdiqlangandan soʻng tuzilgan hisoblanadi.", "l": "uz"}, {"t": "Xavfsizlik pasporti (SDS)", "s": "HUJJATLAR", "b": "Mahsulotning xavfli xususiyatlari, ehtiyot choralari, saqlash va avariya vaqtidagi harakatlar toʻgʻrisidagi maʼlumotlarni oʻz ichiga olgan hujjat; kimyoviy va xavfli yuklar uchun talab qilinadi.", "l": "uz"}, {"t": "Tashqi savdo shartnomasini roʻyxatga olish", "s": "VALYUTA NAZORATI VA BANK", "b": "Eksport yoki import shartnomasini valyuta nazorati va keyingi bojxona rasmiylashtiruvi maqsadida axborot tizimida va xizmat koʻrsatuvchi bankda hisobga qoʻyish.", "l": "uz"}, {"t": "Buyurtmani tasdiqlash", "s": "HUJJATLAR", "b": "Sotuvchining hujjati boʻlib, u orqali xaridor buyurtmasi shartlarini qabul qiladi; buyurtma bilan birgalikda kontraktni almashtirishi mumkin.", "l": "uz"}, {"t": "Sugʻurta sertifikati", "s": "LOGISTIKA VA TASHISH", "b": "Umumiy polis doirasida muayyan partiyaning sugʻurtalanganligini tasdiqlovchi hujjat.", "l": "uz"}, {"t": "Buyurtmalar portfeli", "s": "TIJORAT VA HUQUQ", "b": "Yetkazib beruvchida muayyan sana yoki davrga mavjud boʻlgan buyurtmalar majmui; ishlab chiqarish yuklanishini koʻrsatuvchi koʻrsatkich.", "l": "uz"}, {"t": "Sinov bayonnomasi", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Mahsulot namunalarining sinov natijalari keltirilgan akkreditatsiyalangan laboratoriya hujjati; sertifikat berish yoki deklaratsiyani roʻyxatga olish uchun asos.", "l": "uz"}, {"t": "Yukni raskreditlash", "s": "LOGISTIKA VA TASHISH", "b": "Tashish toʻlovlari va yigʻimlari toʻlangandan soʻng stansiya yoki terminalda hujjatlarni rasmiylashtirish va yukni oluvchiga topshirish.", "l": "uz"}, {"t": "Yuklashga ruxsat", "s": "LOGISTIKA VA TASHISH", "b": "Xaridor yoki uning vakilining hujjati boʻlib, butlash va hujjatlar tekshirilgandan soʻng tayyor tovarni joʻnatishga ruxsat beradi.", "l": "uz"}, {"t": "Renting", "s": "TIJORAT VA HUQUQ", "b": "Transport yoki uskunani sotib olish huquqisiz qisqa muddatli ijaraga olish; xizmat koʻrsatish odatda ijaraga beruvchi zimmasida qoladi.", "l": "uz"}, {"t": "Yigʻma yuk (LCL)", "s": "LOGISTIKA VA TASHISH", "b": "Bir konteyner yoki transport vositasida bir necha yuk egalarining tovarlarini birlashtiruvchi partiya; toʻlov hajm yoki ogʻirlikka mutanosib ravishda amalga oshiriladi.", "l": "uz"}, {"t": "Mahsulotni davlat roʻyxatidan oʻtkazish toʻgʻrisidagi guvohnoma", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Ayrim toifadagi tovarlar (oziq-ovqat qoʻshimchalari, dezinfeksiyalovchi vositalar, ayrim kosmetika va boshqalar) muomalaga chiqarilishidan oldin talab qilinadigan hujjat.", "l": "uz"}, {"t": "Tovar kelib chiqishi sertifikati", "s": "BOJXONA TO'LOVLARI", "b": "Tovarning kelib chiqish mamlakatini tasdiqlovchi hujjat; preferensiyalar, antidemping choralari va kvotalarni qoʻllash uchun zarur.", "l": "uz"}, {"t": "«A» shaklidagi kelib chiqish sertifikati", "s": "BOJXONA TO'LOVLARI", "b": "Rivojlanayotgan mamlakatlarga preferensiyalar beruvchi mamlakatlarga yetkazib berishda Umumiy preferensiyalar tizimi doirasida tarif preferensiyalarini olish uchun sertifikat.", "l": "uz"}, {"t": "ST-1 shaklidagi kelib chiqish sertifikati", "s": "BOJXONA TO'LOVLARI", "b": "MDH erkin savdo zonasi doirasida bojsiz savdo uchun sertifikat; Oʻzbekistonning Hamdoʻstlik mamlakatlariga va aksincha yetkazib berishlarida dolzarb.", "l": "uz"}, {"t": "EAV (erkin ayirboshlanadigan valyuta)", "s": "VALYUTA NAZORATI VA BANK", "b": "Joriy operatsiyalar boʻyicha cheklovlarsiz boshqa valyutalarga erkin almashtiriladigan valyuta; tashqi savdo shartnomalari boʻyicha hisob-kitoblarda ishlatiladi.", "l": "uz"}, {"t": "Spetsifikatsiya", "s": "HUJJATLAR", "b": "Shartnoma yoki hisob-fakturaga ilova boʻlib, tovarlarning turlari, navlari, oʻlchamlari, miqdori va narxlari roʻyxatini oʻz ichiga oladi.", "l": "uz"}, {"t": "Sugʻurta", "s": "LOGISTIKA VA TASHISH", "b": "Sugʻurta badallari hisobidan mulkiy manfaatlarni himoya qilish: kelishilgan hodisa yuz berganda sugʻurtalovchi zararni qoplaydi.", "l": "uz"}, {"t": "Eksport-import yuklarini sugʻurtalash (kargo)", "s": "LOGISTIKA VA TASHISH", "b": "Yukni tashish va qayta ortish davrida shikastlanish, yoʻqolish va yetishmovchilikdan sugʻurtalash. Sugʻurta shartlari va uni toʻlovchi tomon yetkazib berish bazisi bilan belgilanadi.", "l": "uz"}, {"t": "Hisob", "s": "BOJXONA TO'LOVLARI", "b": "Sotuvchining toʻlanadigan summa, tomonlarning rekvizitlari va toʻlov shartlari koʻrsatilgan toʻlov hujjati.", "l": "uz"}, {"t": "Hisob-faktura", "s": "BOJXONA TO'LOVLARI", "b": "Yuk joʻnatilgandan soʻng yoziladigan, tovar tavsifi, narxi, summasi va yetkazib berish shartlari koʻrsatilgan hujjat; toʻlov va bojxona baholash uchun asos boʻlib xizmat qiladi.", "l": "uz"}, {"t": "Hisob-spetsifikatsiya", "s": "HUJJATLAR", "b": "Hisob va spetsifikatsiya maʼlumotlarini birlashtiradigan hujjat: har bir pozitsiya boʻyicha narxlari koʻrsatilgan pozitsiyalar roʻyxati.", "l": "uz"}, {"t": "Dastlabki hisob (proforma-invoys)", "s": "BOJXONA TO'LOVLARI", "b": "Yakuniy hisob-kitobgacha berilgan hisob — oldindan toʻlov, ruxsatnomalarni rasmiylashtirish yoki bitim shartlarini tasdiqlash uchun.", "l": "uz"}, {"t": "Ochiq hisob", "s": "VALYUTA NAZORATI VA BANK", "b": "Yetkazib berishlar taʼminotsiz amalga oshiriladigan va qarz vaqti-vaqti bilan uzib turiladigan hisob-kitob shakli; yuqori ishonchga ega doimiy hamkorlar oʻrtasida qoʻllaniladi.", "l": "uz"}, {"t": "Sochma yuklar", "s": "LOGISTIKA VA TASHISH", "b": "Vagonlar, konteynerlar yoki avtotransportda qadoqsiz, uyum holida tashiladigan bir jinsli yuklar (don, sement, oʻgʻitlar, ruda).", "l": "uz"}, {"t": "Bojxona protsedurasi (bojxona rejimi)", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarlardan bojxona hududida yoki uning tashqarisida foydalanish va tasarruf etish talablari va shartlari majmui; toʻlovlarni toʻlash hamda taqiq va cheklovlarni qoʻllash tartibini belgilaydi.", "l": "uz"}, {"t": "Eksport", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni qayta olib kirish majburiyatisiz, doimiy asosda bojxona hududidan tashqariga olib chiqish protsedurasi.", "l": "uz"}, {"t": "Bojxona tranziti", "s": "LOGISTIKA VA TASHISH", "b": "Tovarni bojxona nazorati ostida bojlar va soliqlar toʻlanmagan holda bir bojxona organidan boshqasiga tashish. Dengizga chiqish imkoni boʻlmagan mamlakat sifatida Oʻzbekiston uchun asosiy tartib-taomil.", "l": "uz"}, {"t": "Bojxona ombori", "s": "LOGISTIKA VA TASHISH", "b": "Olib kirilgan tovarlarni bojxona nazorati ostida bojlar va soliqlar toʻlanmagan holda belgilangan muddat davomida saqlash tartib-taomili.", "l": "uz"}, {"t": "Bojxona hududida qayta ishlash", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Olib kirilgan xom ashyo mamlakat ichida shartli ravishda toʻlovlardan ozod qilingan holda qayta ishlanadigan, qayta ishlash mahsulotlari esa olib chiqiladigan tartib-taomil.", "l": "uz"}, {"t": "Bojxona hududidan tashqarida qayta ishlash", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni qayta ishlash uchun chet elga olib chiqish va keyinchalik qayta ishlash mahsulotlarini imtiyozli shartlarda olib kirish.", "l": "uz"}, {"t": "Ichki isteʼmol uchun qayta ishlash", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Olib kirilgan tovarni mamlakat hududida qayta ishlash va keyinchalik qayta ishlash mahsulotlarini tayyor mahsulot uchun belgilangan stavkalar boʻyicha toʻlovlarni toʻlagan holda erkin muomalaga chiqarish.", "l": "uz"}, {"t": "Vaqtincha olib kirish (ruxsat)", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni belgilangan muddatga toʻlovlardan toʻliq yoki qisman ozod qilingan holda va oʻzgarmagan holatda olib chiqish majburiyati bilan olib kirish tartib-taomili.", "l": "uz"}, {"t": "Vaqtincha olib chiqish", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni oʻzgarmagan holatda (tabiiy eskirishni hisobga olgan holda) qaytarib olib kirish majburiyati bilan muayyan muddatga olib chiqish.", "l": "uz"}, {"t": "Reimport", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Ilgari olib chiqilgan tovarni belgilangan shartlar va muddatlarga rioya qilgan holda bojlar va soliqlar toʻlanmagan holda bojxona hududiga qaytarish.", "l": "uz"}, {"t": "Reeksport", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Ilgari olib kirilgan tovarni bojxona hududidan tashqariga olib chiqish, shu jumladan shartlar bajarilganda toʻlangan toʻlovlarni qaytarish bilan.", "l": "uz"}, {"t": "Bojsiz savdo", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Duty free doʻkonlarida mamlakat hududidan tashqariga chiqayotgan shaxslarga tovarlarni boj va soliqlar toʻlamasdan sotish tartibi.", "l": "uz"}, {"t": "Yoʻq qilish", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni i 'stemol xususiyatlarini yoʻqotadigan holatga keltirish tartibi, toʻlovlar toʻlanmasdan; xarajatlarni deklarant koʻtaradi.", "l": "uz"}, {"t": "Davlat foydasiga voz kechish", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni toʻlovlar toʻlamasdan davlat mulkiga tekin oʻtkazish tartibi.", "l": "uz"}, {"t": "Erkin bojxona zonasi / erkin ombor", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarlarni ETZ yoki erkin ombor hududida boj va soliqlar toʻlamasdan hamda notarif tartibga solish choralarini qoʻllamasdan joylashtirish va foydalanish tartibi.", "l": "uz"}, {"t": "Maxsus bojxona tartibi", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarlarning ayrim toifalari uchun (gumanitar yordam, diplomatik yuklar, taʼminot buyumlari va boshqalar) maxsus koʻchirish tartibiga ega protsedura.", "l": "uz"}, {"t": "Bojxona rasmiylashtiruvi (tozalash)", "s": "BOJXONA TARTIBLARI VA REJIMLARI", "b": "Tovarni bojxona tartibiga joylashtirish boʻyicha harakatlar majmui: deklaratsiyalash, hujjatlarni nazorat qilish, koʻrik, toʻlovlarni toʻlash va chiqarish.", "l": "uz"}, {"t": "Bojxona bojlari", "s": "BOJXONA TO'LOVLARI", "b": "Tovarni olib kirish yoki olib chiqishda tarif stavkalari boʻyicha undiriladigan majburiy toʻlovlar. Ad valorem (qiymatdan foizda), spetsifik (birlik uchun) va kombinatsiyalangan turlari boʻladi.", "l": "uz"}, {"t": "Fura", "s": "LOGISTIKA VA TASHISH", "b": "Xalqaro tashishlar uchun yarim tirkamali yuk koʻtaruvchan avtomobil; standart sigʻimi taxminan 82–92 m³ va 20–22 t gacha yuk.", "l": "uz"}, {"t": "Fraxt", "s": "LOGISTIKA VA TASHISH", "b": "Yukni yetkazib berish uchun tashuvchiga toʻlov; toʻlash shartlari va momenti (joʻnatish yoki manzil punktida) tashish shartnomasida qayd etiladi.", "l": "uz"}, {"t": "Fraxt stavkasi", "s": "LOGISTIKA VA TASHISH", "b": "Yuk birligi, ogʻirligi, hajmi yoki konteyner uchun tashish narxi; yoʻnalish, yuk turi va tashishlar bozori konʼyunkturasiga bogʻliq.", "l": "uz"}, {"t": "Charter", "s": "LOGISTIKA VA TASHISH", "b": "Muayyan yuk partiyasini tashish uchun transport vositasini (kema, vagonlar, havo kemasi) toʻliq yoki qisman fraxtlash shartnomasi.", "l": "uz"}, {"t": "Kontrakt narxi", "s": "TIJORAT VA HUQUQ", "b": "Tomonlar kelishgan tovar qiymati boʻlib, valyuta, yetkazib berish bazisi va unga nimalar kirishi koʻrsatiladi. Qatʼiy, keyinchalik qayd etiladigan yoki siljuvchi boʻladi.", "l": "uz"}, {"t": "Siljuvchi narx", "s": "TIJORAT VA HUQUQ", "b": "Kontrakt ijrosi momentiga materiallar va ish kuchi qiymati oʻzgarishini hisobga olgan formula boʻyicha qayta hisoblanadigan narx; uzoq muddatli yetkazib berishlar va uskunalarda qoʻllaniladi.", "l": "uz"}, {"t": "Eksport litsenziyasi", "s": "RUXSAT BERUVCHI HUJJATLAR", "b": "Litsenziyalanadigan roʻyxatga kiritilgan tovarlarni olib chiqishga vakolatli organning ruxsati; partiyaga yoki davrga beriladi.", "l": "uz"}, {"t": "Eksport hujjatlari", "s": "HUJJATLAR", "b": "Olib chiqish uchun hujjatlar toʻplami: kontrakt, invoys, qadoqlash varagʻi, transport hujjati, kelib chiqish sertifikati, ruxsat beruvchi hujjatlar va deklaratsiya.", "l": "uz"}, {"t": "Advance payment (prepayment)", "s": "CUSTOMS PAYMENTS", "b": "Part or the full amount of payment transferred before the delivery of goods or the provision of a service. 100% prepayment is beneficial for the exporter and risky for the importer.", "l": "en"}, {"t": "Buyer's advance payment", "s": "CUSTOMS PAYMENTS", "b": "A form of commercial financing of the supplier: the importer pays part of the order value (usually from 15%) upon signing the contract.", "l": "en"}, {"t": "Agent", "s": "COMMERCE & LAW", "b": "A legal entity or individual acting on the instructions of, at the expense of, and on behalf of the principal for a fee; usually prepares transactions but does not sign them.", "l": "en"}, {"t": "Agency agreement", "s": "COMMERCE & LAW", "b": "A contract between the principal and the agent: territory of operation, scope of the assignment, price limits, amount of remuneration, reporting procedure and conditions of termination.", "l": "en"}, {"t": "Letter of credit", "s": "CURRENCY CONTROL & BANKING", "b": "An instruction to a bank to pay a sum to the beneficiary upon fulfilment of the conditions of the letter of credit. A distinction is made between cash and documentary, revocable and irrevocable, confirmed, revolving, and transferable ones.", "l": "en"}, {"t": "Acceptance", "s": "DOCUMENTS", "b": "The buyer's consent to accept all the terms of a firm offer without changes.", "l": "en"}, {"t": "Acceptance of a bill of exchange", "s": "CUSTOMS PAYMENTS", "b": "The written consent of the debtor to pay a bill of exchange within the specified term, placed on the face of the bill of exchange.", "l": "en"}, {"t": "Banker's acceptance", "s": "CURRENCY CONTROL & BANKING", "b": "Acceptance of a bill of exchange by a bank at the request of the importer; the bank assumes the obligation of payment, for which it charges a commission. It increases the reliability of the bill of exchange.", "l": "en"}, {"t": "Anti-dumping regulation", "s": "COMMERCE & LAW", "b": "Rules directed against the sale of imported goods at prices below the domestic market prices of the country of origin; based on Article VI of GATT and the WTO Anti-Dumping Agreement.", "l": "en"}, {"t": "Arbitration", "s": "COMMERCE & LAW", "b": "Resolution of property disputes by an arbitration (arbitral) tribunal in the manner provided for by law or by the arbitration clause of a contract.", "l": "en"}, {"t": "Seizure of cargo", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "A measure applied in the event of a violation of customs rules — for example, in the case of inaccurate information about the quantity, marking or country of origin of goods.", "l": "en"}, {"t": "Lease", "s": "COMMERCE & LAW", "b": "Transfer of property for temporary use for a fee; ownership remains with the lessor, and at the end of the term buyout is possible.", "l": "en"}, {"t": "Basic delivery terms", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "Contract terms that allocate between the seller and the buyer the costs of delivery and the moment of transfer of the risks of loss of or damage to the goods.", "l": "en"}, {"t": "Bulk (in bulk)", "s": "LOGISTICS & TRANSPORT", "b": "A method of carrying cargo without packaging or containers — loose or piled in a means of transport.", "l": "en"}, {"t": "Barter transaction", "s": "CURRENCY CONTROL & BANKING", "b": "Foreign trade exchange of goods of equal value without monetary settlements; may be bilateral or multilateral.", "l": "en"}, {"t": "Bonded (customs) cargo", "s": "LOGISTICS & TRANSPORT", "b": "Imported goods stored in a customs warehouse on which duties and taxes have not yet been paid.", "l": "en"}, {"t": "Broker", "s": "COMMERCE & LAW", "b": "An intermediary in concluding trade and transport transactions, receiving a commission for selecting a counterparty and drawing up the contract.", "l": "en"}, {"t": "Customs broker (customs representative)", "s": "COMMERCE & LAW", "b": "A company that, on behalf of the declarant, draws up customs documents and supports the payment of duties and the completion of procedures.", "l": "en"}, {"t": "Currency of payment", "s": "CURRENCY CONTROL & BANKING", "b": "The currency in which settlement for the goods is made; it may differ from the currency of price — in that case the conversion rate is fixed in the contract.", "l": "en"}, {"t": "Bill of exchange", "s": "CUSTOMS PAYMENTS", "b": "A written debt obligation of a prescribed form giving the right to demand payment of the specified amount by the due date. It may be a promissory note or a draft, and is transferred by endorsement.", "l": "en"}, {"t": "Gross weight", "s": "LOGISTICS & TRANSPORT", "b": "The mass of the goods together with the inner and outer packaging.", "l": "en"}, {"t": "Net weight", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "The mass of the goods without packaging. Used in calculating the customs value index and specific duties.", "l": "en"}, {"t": "Sanitary and epidemiological certificate", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "A document confirming that products are safe for human health; requested when importing food products, plant raw materials, etc.", "l": "en"}, {"t": "Quarantine (phytosanitary) certificate", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "A document stating that plant products are not infected with pests and diseases and originate from an unaffected area.", "l": "en"}, {"t": "Release of goods", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "Permission by the customs authority to use and dispose of goods in accordance with the declared customs procedure after completion of clearance.", "l": "en"}, {"t": "Release for free circulation", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "A procedure under which imported goods remain within the territory of the country without any obligation of re-export, after payment of duties and charges and compliance with prohibitions and restrictions.", "l": "en"}, {"t": "Foreign economic activity", "s": "FOREIGN-TRADE GLOSSARY", "b": "The totality of a company's foreign trade, investment and other operations on foreign markets: the exchange of goods, services, works, information and rights to the results of intellectual activity.", "l": "en"}, {"t": "Warranty obligation", "s": "DOCUMENTS", "b": "A document from the supplier confirming that the delivered goods (most often equipment) comply with the terms of the contract and are operational when used correctly.", "l": "en"}, {"t": "Bank guarantee (letter of guarantee)", "s": "CURRENCY CONTROL & BANKING", "b": "An obligation of the guarantor bank to pay the creditor the amount due from the debtor in the event of the debtor's failure to fulfil its obligations.", "l": "en"}, {"t": "Cargo", "s": "LOGISTICS & TRANSPORT", "b": "Goods in the process of transportation. By transport characteristics it is divided into general, bulk, liquid, perishable and dangerous cargo; the packaging, transportation technique and tariff depend on the type of cargo.", "l": "en"}, {"t": "Declaration of conformity", "s": "PERMITS & REQUIRED DOCUMENTS", "b": "A document by which the applicant confirms the conformity of products with the mandatory requirements of standards and technical regulations; it is subject to registration with the authorised certification body.", "l": "en"}, {"t": "Customs declaration", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "A statement by the declarant to customs in the established form containing information about the goods: HS code, description, weight, value, country of origin, means of transport, purpose of import or export, and a list of the attached documents.", "l": "en"}, {"t": "Customs declaring (procedure)", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "Submission by the declarant or the customs representative of information on the goods and the chosen customs procedure; in most cases it is carried out in electronic form.", "l": "en"}, {"t": "Declarant", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "A person who declares the goods or on whose behalf the goods are declared, and who is responsible for the accuracy of the declared information.", "l": "en"}, {"t": "Transit declaration", "s": "LOGISTICS & TRANSPORT", "b": "A declaration drawn up for goods moved under the customs transit procedure from one customs authority to another.", "l": "en"}, {"t": "Passenger customs declaration", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "A declaration for goods moved by individuals across the border in excess of the duty-free import allowances or subject to mandatory declaration.", "l": "en"}, {"t": "Dumping", "s": "COMMERCE & LAW", "b": "Export of goods at a price below their normal value on the domestic market of the country of origin; the amount of the excess is called the dumping margin.", "l": "en"}, {"t": "Currency dumping", "s": "COMMERCE & LAW", "b": "Export at understated prices at the expense of the difference between the depreciation of the national currency on the external and domestic markets.", "l": "en"}, {"t": "Guarantee deposit", "s": "CUSTOMS PAYMENTS", "b": "Monetary security for a transaction or contract, paid by a participant to cover possible obligations.", "l": "en"}, {"t": "Voluntary export restraints", "s": "COMMERCE & LAW", "b": "A situation where the importing country obtains from the exporter a self-imposed restriction on the export of certain goods instead of introducing import quotas.", "l": "en"}, {"t": "Technical documentation", "s": "DOCUMENTS", "b": "A set of documents for equipment and machinery: passport, installation and operation manuals, diagrams, drawings, spare parts lists. The list and language are stipulated in the contract.", "l": "en"}, {"t": "Demurrage", "s": "LOGISTICS & TRANSPORT", "b": "A charge for the excess idle time of a means of transport or container under loading or unloading, accrued for each day of delay.", "l": "en"}, {"t": "Storage beyond the free period (storage)", "s": "LOGISTICS & TRANSPORT", "b": "A charge levied by a terminal or port for storing cargo beyond the free period.", "l": "en"}, {"t": "Order", "s": "DOCUMENTS", "b": "A buyer's commercial document setting out the conditions for the manufacture or preparation of goods and the essential elements of the future transaction.", "l": "en"}, {"t": "Customs value index (ITS)", "s": "CUSTOMS PROCEDURES & REGIMES", "b": "The price of one kilogram of goods in US dollars — the ratio of the customs value to the net weight. Used by customs as a control benchmark when verifying the declared value.", "l": "en"}, {"t": "Incoterms", "s": "DELIVERY TERMS — INCOTERMS 2020", "b": "A set of international rules for the interpretation of delivery terms (three-letter terms) that distribute costs, clearance obligations and the transfer of risks between the seller and the buyer. The current edition is Incoterms 2020.", "l": "en"}, {"t": "Price indices", "s": "COMMERCE & LAW", "b": "Indicators of the relative change in the average level of prices — wholesale, retail, export, import, etc.", "l": "en"}, {"t": "Engineering", "s": "COMMERCE & LAW", "b": "Engineering and consulting services: design, feasibility studies, supervised installation, commissioning of a facility, and supervision of operation.", "l": "en"}, {"t": "Collection", "s": "CURRENCY CONTROL & BANKING", "b": "A form of settlement in which a bank, on the instructions of the exporter, obtains payment from the importer. A distinction is made between clean collection (against payment documents) and documentary collection (against surrender of commercial documents).", "l": "en"}, {"t": "HS Code (Commodity Nomenclature of Foreign Economic Activity Code)", "s": "HS CODE & GOODS CLASSIFICATION", "b": "A ten-digit code of the commodity nomenclature of foreign economic activity that determines the rates of customs duties and taxes, non-tariff regulation measures and the list of required authorization documents.", "l": "en"}, {"t": "Through Bill of Lading", "s": "LOGISTICS & TRANSPORT", "b": "A bill of lading covering carriage involving several carriers or modes of transport up to the final destination — relevant for delivery to Uzbekistan through seaports with subsequent rail or road transport.", "l": "en"}, {"t": "Warehouse Receipt", "s": "LOGISTICS & TRANSPORT", "b": "A warehouse acknowledgement of acceptance of goods for storage for a fixed term against payment; it confirms the right of the owner, or of a person named by endorsement, to receive the goods.", "l": "en"}, {"t": "Warrant (Pledge Certificate)", "s": "LOGISTICS & TRANSPORT", "b": "Part of a double warehouse certificate granting the right to the goods to the extent of the loan issued against it; both certificates must be presented for the release of the goods.", "l": "en"}, {"t": "Clearing", "s": "CURRENCY CONTROL & BANKING", "b": "A system of non-cash settlements based on the set-off of mutual claims and obligations; in international settlements it is formalized by intergovernmental clearing agreements.", "l": "en"}, {"t": "Cover Note", "s": "LOGISTICS & TRANSPORT", "b": "A document issued by an insurer or broker notifying the insured that insurance has been arranged in accordance with their instructions.", "l": "en"}, {"t": "Competitiveness", "s": "COMMERCE & LAW", "b": "A characteristic of a product relative to competitors in terms of the degree to which it satisfies a need and the costs of doing so; it determines the possibilities of sale on a specific market.", "l": "en"}, {"t": "Contract of sale", "s": "DOCUMENTS", "b": "The principal commercial document of a transaction: an agreement for the supply of goods and related services, signed by the exporter and the importer.", "l": "en"}, {"t": "Model contract", "s": "DOCUMENTS", "b": "A sample agreement with unified terms, prepared in advance and adaptable to a specific transaction.", "l": "en"}, {"t": "Commodity market conditions", "s": "COMMERCE & LAW", "b": "The current state of the market under the influence of economic, social and natural factors; it determines prices, the choice of counterparties and the timing of market entry.", "l": "en"}, {"t": "Leasing", "s": "COMMERCE & LAW", "b": "Long-term rental of equipment and transport financed by a leasin // Наименование в ТН ВЭД — склейка всех уровней иерархии, и у соседних кодов совпадает почти всё
// начало: список выглядел как одинаковые абзацы на 400 знаков. Срезаем общее начало по словам и
// показываем то, чем коды ОТЛИЧАЮТСЯ (тот же приём, что в боте — keyboards.distinct_labels).
function distinctLabels(items,width=90){
  const words=items.map(i=>String(i.name||'').split(/\s+/).filter(Boolean));
  const cut=s=>s.length>width?s.slice(0,width).replace(/\s+\S*$/,'')+'…':s;
  if(words.length<2) return words.map(w=>cut(w.join(' ')));
  const common=(a,b)=>{let k=0;while(k<Math.min(a.length,b.length)&&a[k]===b[k])k++;return k};
  const codes=items.map(i=>String(i.code||''));
  const out=words.map((w,i)=>{
    // Общее начало считаем среди кодов ОДНОЙ длины: в выдаче бывают 6- и 10-значные,
    // у них названия разной длины, и «общее для всех» схлопывалось бы до нуля.
    let peers=words.filter((_,j)=>j!==i&&codes[j].length===codes[i].length);
    if(!peers.length) peers=words.filter((_,j)=>j!==i);
    let start=peers.length?Math.min(...peers.map(o=>common(w,o))):0;
    start=Math.min(start,Math.max(w.length-1,0));
    const t=w.slice(start).join(' ').replace(/^[\s,;:—-]+|[\s,;:—-]+$/g,'')||w.join(' ');
    return (start?'…':'')+cut(t);
  });
  // Второй проход: если общее начало длиннее подписи, различие не влезло и строки совпали.
  // Для таких сдвигаем старт к расхождению с БЛИЖАЙШИМ соседом — там и сидит отличие.
  const dup=new Set(out.filter(x=>out.filter(y=>y===x).length>1));
  words.forEach((w,i)=>{
    if(!dup.has(out[i])) return;
    const others=words.filter((_,j)=>j!==i);
    let start=others.length?Math.max(...others.map(o=>common(w,o))):0;
    start=Math.min(start,Math.max(w.length-1,0));
    const t=w.slice(start).join(' ').replace(/^[\s,;:—-]+|[\s,;:—-]+$/g,'')||w.join(' ');
    out[i]=(start?'…':'')+cut(t);
  });
  return out;
}
