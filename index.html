  if(q.length<2){pickedCode=null;c_picked.textContent='';c_sug.style.display='none';return}
  const d=await api('/api/search?q='+encodeURIComponent(q)+'&lang='+lang);
  c_sug.innerHTML=d.items.slice(0,6).map(i=>`<div data-c="${i.code}">${i.code} — ${(i.name||'').slice(0,60)}</div>`).join('');
  c_sug.style.display=d.items.length?'block':'none';
  c_sug.querySelectorAll('div').forEach(el=>el.onclick=()=>{
    pickedCode=el.dataset.c; c_q.value=el.dataset.c; c_picked.textContent='Код: '+el.dataset.c;
    c_sug.style.display='none'; utilUpdate();
  });
},250);
c_q.oninput=()=>{csug(); utilUpdate();};
c_go.onclick=async()=>{
  const code=pickedCode||c_q.value.replace(/\s/g,'');
  const inv=parseFloat(c_price.value)||0;
  // Таможенная стоимость = инвойс + транспорт до границы + страховка (то, что не в цене по Incoterms).
  const cust=inv+(parseFloat(c_transport.value)||0)+(parseFloat(c_ins.value)||0);
  if(!/^\d{4,}$/.test(code)||!cust){c_out.innerHTML='<div class="empty">'+L.need+'</div>';return}
  // Транспорт без объёма двигателя не считаем: специфическая часть пошлины ($/куб. см) и утильсбор
  // просто не начислятся, а человек уедет с суммой, заниженной в разы. Лучше попросить цифру.
  const veh=c_util.style.display!=='none';
  if(veh&&utilField==='volume_cm3'&&!(parseFloat(c_uval.value)>0)){
    c_out.innerHTML='<div class="card"><div class="line" style="color:#d33;font-weight:600">⚠️ '+L.need_vol+'</div></div>';
    c_uval.focus(); return;
  }
  c_out.innerHTML='<div class="empty">…</div>';
  const body={code,price_usd:cust,qty:parseFloat(c_qty.value)||0,has_certificate:c_cert.checked,
      origin_country:c_orig.value,weight_kg:parseFloat(c_wt.value)||0,lang,initData:(tg&&tg.initData)||''};
  // Транспорт: двигатель, возраст и характеристику (объём/масса/мощность) — они влияют и на
  // пошлину, и на утильсбор. Возраст в полных годах задаёт коэффициент по ПКМ №347.
  if(veh){
    body.engine_type=c_eng.value; body.is_new=(c_age.value==='new');
    const uv=parseFloat(c_uval.value); if(uv) body[utilField]=uv;
    const yr=parseFloat(c_years.value); if(yr>=0) body.age_years=yr;
    // Число машин: для ставки за куб. см объём умножается на количество (по умолчанию одна).
    if(!body.qty) body.qty=1;
  }
  const r=await fetch(API+'/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const d=await r.json();
  if(d.gated){
    c_disc.textContent='';
    // Сообщение приходит с переносами строк (витрина состава расчёта) — сохраняем их.
    c_out.innerHTML='<div class="card"><div style="white-space:pre-line">'+(d.message||'')+'</div>'+
      '<button class="go" id="c_pay" style="margin-top:12px">'+L.tochat+'</button></div>';
    const pb=document.getElementById('c_pay'); if(pb) pb.onclick=()=>{ if(tg) tg.close(); };
    return;
  }
  const res=(d.result&&d.result.result_sum)||{};
  let h='<div class="card">';
  if(d.name) h+='<div class="hint">'+d.name+'</div>';
  if(d.preference&&d.preference.note) h+='<div class="line" style="color:var(--brand,#16a34a);font-weight:600">'+d.preference.note+'</div>';
  h+=`<div class="line"><span>${L.cust} (${c_inco.value})</span><b>${fmt(cust)} USD</b></div>`;
  for(const[k,v] of Object.entries(res)){
    if(k.startsWith('ИТОГО')) continue;
    if((k==='Акциз'||k.startsWith('Дополнительная'))&&!v) continue;
    h+=`<div class="line"><span>${k}</span><b>${fmt(v)} сум</b></div>`;
  }
  const totalPay=res['ИТОГО платежей'];
  if(totalPay!==undefined)
    h+=`<div class="line total"><span>${L.total}</span><b>${fmt(totalPay)} сум</b></div>`;
  // Расчёт неполный (нет объёма двигателя для ставки за куб. см, веса для «$/кг» и т.п.).
  // Показываем ДО итога-впечатления: жирная сумма без этой пометки читается как окончательная.
  if(d.warnings&&d.warnings.length)
    h+='<div class="line" style="color:#d33;font-weight:600">⚠️ '+d.warnings.join(' ')+'</div>';
  // То, что знает чат: риск КТС (занижение цены), разрешительные, маркировка.
  if(d.permits&&d.permits.length) h+='<div class="hint">📋 Разрешительные: '+d.permits.map(p=>p.permit+(p.npa?' ('+p.npa+')':'')).join('; ')+'</div>';
  if(d.marking&&d.marking.requirement) h+='<div class="hint">🏷 Маркировка: '+d.marking.requirement+(d.marking.npa?' ('+d.marking.npa+')':'')+'</div>';
  // Утилизационный сбор (для транспорта): отдельной строкой + общий итог.
  const u=d.recycling;
  if(u){
    if(u.ok && u.amount_uzs){
      h+=`<div class="line"><span>${L.util_line}</span><b>${fmt(u.amount_uzs)} сум</b></div>`;
      if(totalPay!==undefined)
        h+=`<div class="line total"><span>${L.util_grand}</span><b>${fmt(totalPay+u.amount_uzs)} сум</b></div>`;
    } else if(u.note){
      h+=`<div class="hint">🚗 ${u.category||''}: ${u.note}</div>`;
    }
  }
  h+=`<div class="hint">${L.rate}: ${fmt(d.rate_cbu)} · ${d.duty_label||''}</div>`;
  // Построчные правовые основания (НПА по каждому платежу) — юр. точность, как у справочника.
  const npa=d.result&&d.result.npa;
  if(npa&&Object.keys(npa).length){
    h+='<div class="hint" style="margin-top:6px"><b>'+L.npa_title+':</b><br>'+
       Object.entries(npa).map(([k,v])=>'• '+k.split(' (')[0]+': '+v).join('<br>')+'</div>';
  }
  // PDF-отчёт (платно): та же серверная сборка, что и в чате; готовый файл уходит в чат бота.
  h+=`<button class="go" id="c_pdf" style="margin-top:12px">${L.pdf}</button>`;
  h+='<div class="hint" id="c_pdf_msg" style="margin-top:6px"></div></div>';
  c_out.innerHTML=h; c_disc.textContent=L.disc;
  const pdfBtn=document.getElementById('c_pdf'), pdfMsg=document.getElementById('c_pdf_msg');
  if(pdfBtn) pdfBtn.onclick=async()=>{
    pdfBtn.disabled=true; pdfMsg.textContent=L.pdf_wait;
    try{
      const pr=await fetch(API+'/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)});
      const pd=await pr.json();
      if(pd.ok){ pdfMsg.textContent=pd.message||L.pdf_ok; }
      else if(pd.upsell){  // нет права на PDF → кнопка ведёт на оформление тарифа в чате
        pdfMsg.textContent=pd.message||'';
        pdfBtn.textContent=L.pdf_up; pdfBtn.disabled=false; pdfBtn.onclick=()=>{ if(tg) tg.close(); };
      } else { pdfMsg.textContent=pd.message||'—'; pdfBtn.disabled=false; }
    }catch(e){ pdfMsg.textContent='—'; pdfBtn.disabled=false; }
  };
};

// ---- КОД ----
let k_limit=30;                       // сколько показываем; «показать ещё» поднимает лимит
const runCodeSearch=async()=>{
  const q=k_q.value.trim(); if(q.length<2){k_list.innerHTML='';k_cnt.textContent='';return}
  const d=await api('/api/search?q='+encodeURIComponent(q)+'&limit='+k_limit+'&lang='+lang);
  // Показываем НАЙДЕНО/ПОКАЗАНО: раньше выводилась длина выдачи, и человек думал, что видит всё,
  // хотя список молча обрезался (аудит FREE-04).
  const _total=(d.total!=null?d.total:d.items.length);
  k_cnt.textContent=d.items.length
    ? (_total>d.items.length ? d.items.length+' / '+_total : ''+_total)
    : L.empty;
  const _lbl=distinctLabels(d.items);
  k_list.innerHTML=d.items.map((i,idx)=>
    `<div class="item"><div class="term" data-i="${idx}"><span><span class="code">${i.code}</span>${i.duty?' <b>'+esc(i.duty)+'</b>':''} <span class="name">${esc(_lbl[idx])}</span></span><span class="arrow">›</span></div><div class="body" id="kb${idx}"></div></div>`
  ).join('');
  k_list.querySelectorAll('.term').forEach(t=>t.onclick=async()=>{
    const it=t.closest('.item'); it.classList.toggle('open');
    const bd=it.querySelector('.body');
    if(it.classList.contains('open')&&!bd.dataset.done){
      bd.dataset.done='1'; bd.textContent='…';
      const code=d.items[t.dataset.i].code;
      const rd=await api('/api/rates?code='+code);
      const R=(rd.rates)||{}; const du=R.duty||{};
      // Паритет с ботом: акциз, органы по коду и основание с датой сверки. Раньше приложение
      // показывало только пошлину и НДС, а внизу стояло «Ориентировочно, точно — в чате бота»,
      // то есть бесплатный справочник сам объявлял себя неточным (аудит FREE-13).
      const _exc=(R.excise&&R.excise.label)||'';
      const excTxt=(!_exc||_exc==='не установлен')?'не подакцизный':_exc;
      const CB=R.cert_bodies||{}; const bodies=(CB.matched||[]);
      const bodiesHtml=bodies.length
        ? `<div class="line" style="align-items:flex-start"><span>Органы</span><b style="text-align:right">`+
          bodies.slice(0,3).map(b=>`${esc(b.name||'')}${b.email?' · '+esc(b.email):''}`).join('<br>')+
          (CB.total>3?`<br>…ещё ${CB.total-3}`:'')+`</b></div>`
        : '';
      const npa=[].concat(R.duty&&R.duty.npa?[R.duty.npa]:[], R.excise&&R.excise.npa?[R.excise.npa]:[]);
      bd.innerHTML=`<div class="line"><span>Пошлина</span><b>${esc(du.label||((du.advalorem_pct??'—')+'%'))}</b></div>`+
        `<div class="line"><span>Акциз</span><b>${esc(excTxt)}</b></div>`+
        `<div class="line"><span>НДС</span><b>${R.vat_exempt?'освобождён':((R.vat_pct)||12)+'%'}</b></div>`+
        bodiesHtml+
        `<button class="subbtn" data-code="${code}" style="margin:6px 0;padding:6px 12px;border:1px solid var(--brand-soft,#e2f5e9);border-radius:10px;background:transparent;color:var(--brand,#16a34a);font-weight:600;cursor:pointer">📂 Подкоды группы</button>`+
        `<div class="subs"></div>`+
        `<div class="hint">${npa.length?'Основание: '+esc(npa.join(', ')):''}${CB.checked_at?' · органы сверены '+esc(CB.checked_at):''}</div>`;
      bd.querySelector('.subbtn').onclick=async(e)=>{
        const box=bd.querySelector('.subs');
        if(box.dataset.done){box.innerHTML='';box.dataset.done='';return;}
        box.dataset.done='1'; box.textContent='…';
        const ch=await api('/api/children?code='+e.target.dataset.code+'&lang='+lang);
        const _sl=distinctLabels(ch.items||[]);
        box.innerHTML=(ch.items||[]).map((x,j)=>
          `<div class="term subc" data-code="${x.code}" style="padding:5px 0"><span><span class="code">${x.code}</span>${x.duty?' <b>'+esc(x.duty)+'</b>':''} <span class="name">${esc(_sl[j])}</span></span><span class="arrow">›</span></div><div class="sbody" id="sb${j}"></div>`
        ).join('')||'—';
        box.querySelectorAll('.subc').forEach(s=>s.onclick=async()=>{
          const sb=s.nextElementSibling;
          if(sb.dataset.done){sb.innerHTML='';sb.dataset.done='';return;}
          sb.dataset.done='1'; sb.textContent='…';
          const r2=await api('/api/rates?code='+s.dataset.code);
          const du2=(r2.rates&&r2.rates.duty)||{};
          sb.innerHTML=`<div class="line"><span>Пошлина</span><b>${du2.label||(du2.advalorem_pct??'—')+'%'}</b></div>`+
            `<div class="line"><span>НДС</span><b>${r2.rates&&r2.rates.vat_exempt?'освобождён':((r2.rates&&r2.rates.vat_pct)||12)+'%'}</b></div>`;
        });
      };
    }
  });
  // «Показать ещё»: выдача обрезалась молча, и человек считал, что видит всё (аудит FREE-04).
  if(_total>d.items.length){
    const more=document.createElement('button');
    more.className='subbtn';
    more.style.cssText='margin:8px 0;padding:8px 14px;border:1px solid var(--brand-soft,#e2f5e9);border-radius:10px;background:transparent;color:var(--brand,#16a34a);font-weight:600;cursor:pointer;width:100%';
    more.textContent=(L.more_btn||'Показать ещё')+' ('+(_total-d.items.length)+')';
    more.onclick=()=>{ k_limit=Math.min(k_limit+50,200); more.textContent='…'; runCodeSearch(); };
    k_list.appendChild(more);
  }
};
k_q.oninput=debounce(()=>{ k_limit=30; runCodeSearch(); },250);

// ---- РАЗРЕШИТЕЛЬНЫЕ ----
const esc=s=>(s||'').replace(/</g,'&lt;');
async function permLoad(code){
  p_out.innerHTML='<div class="empty">…</div>';
  const d=await api('/api/permits?code='+encodeURIComponent(code)+'&lang='+lang);
  let h='<div class="card">';
  if(d.name) h+='<div class="hint">'+esc(d.name)+'</div>';
  // Подтверждение соответствия
  h+='<div class="line"><span>'+L.conf_t+'</span><b>'+
     (d.conformity ? (d.conformity.form_key==='cert'?L.form_cert:d.conformity.form_key==='declaration'?L.form_decl:esc(d.conformity.form_ru))
                   : '—')+'</b></div>';
  if(!d.conformity) h+='<div class="hint">'+L.no_conf+'</div>';
  // Сан-эпид
  if(d.sanitary) h+='<div class="line"><span>'+L.sanit_t+'</span><b>✔</b></div>';
  // Маркировка
  if(d.marking) h+='<div class="line"><span>'+L.mark_t+'</span><b>'+esc(d.marking.requirement||'✔')+
     '</b></div><div class="hint">'+esc(d.marking.npa||'')+(d.marking.since?' · '+esc(d.marking.since):'')+'</div>';
  // Доп. требования из актов
  if(d.requirements&&d.requirements.length){
    h+='<div class="line total" style="font-size:15px"><span>'+L.req_t+'</span><span></span></div>';
    d.requirements.forEach(r=>{ h+='<div class="line"><span>'+esc(r.permit)+'</span><b class="sec">'+esc(r.npa)+'</b></div>'; });
  }
  // Справочник требований (тот же, что в карточке чата): раньше приложение его не показывало
  // и по кофе выдавало 2 пункта против 8 в боте.
  const block=(title,items)=>{
    if(!items||!items.length) return '';
    let x='<div class="line total" style="font-size:15px"><span>'+title+'</span><span></span></div>';
    items.forEach(t=>{ x+='<div class="hint" style="margin:4px 0">• '+esc(t)+'</div>'; });
    return x;
  };
  h+=block(L.certs_t,d.certs)+block(L.lgota_t,d.lgota)+block(L.other_t,d.other);
  if(!d.found) h+='<div class="hint">'+L.not_found+'</div>';
  if(d.checked_at) h+='<div class="hint">'+L.checked_t+': '+esc(d.checked_at)+'</div>';
  h+='</div>';
  h+='<div class="hint">'+L.perm_cav+'</div>';
  h+='<div class="hint">'+L.src+': '+esc(d.source||'')+'</div>';
  p_out.innerHTML=h;
}
let pPicked=null;
const psug=debounce(async()=>{
  const q=p_q.value.trim();
  if(/^\d[\d\s]{3,}$/.test(q)){pPicked=q.replace(/\s/g,'');p_sug.style.display='none';permLoad(pPicked);return}
  if(q.length<2){p_sug.style.display='none';return}
  const d=await api('/api/search?q='+encodeURIComponent(q)+'&lang='+lang);
  p_sug.innerHTML=d.items.slice(0,6).map(i=>`<div data-c="${i.code}">${i.code} — ${esc(i.name).slice(0,60)}</div>`).join('');
  p_sug.style.display=d.items.length?'block':'none';
  p_sug.querySelectorAll('div').forEach(el=>el.onclick=()=>{
    pPicked=el.dataset.c; p_q.value=el.dataset.c; p_picked.textContent='Код: '+el.dataset.c;
    p_sug.style.display='none'; permLoad(pPicked);
  });
},250);
p_q.oninput=psug;

// ---- ВИКИ ----
const witems=WIKI.filter(d=>d.l===lang);
const wnorm=s=>(s||'').toLowerCase().replace(/[^0-9a-zа-яёʻ' ]/g,'');
function wrender(q){
  const nq=wnorm(q);
  const list=nq?witems.filter(d=>wnorm(d.t).includes(nq)||wnorm(d.b).includes(nq)):witems;
  w_cnt.textContent=L.terms(list.length);
  if(!list.length){w_list.innerHTML='<div class="empty">'+L.empty+'</div>';return}
  w_list.innerHTML=list.map((d,i)=>
    `<div class="item"><div class="term" data-i="${i}"><span>${d.t} <span class="sec">${d.s||''}</span></span><span class="arrow">›</span></div><div class="body">${(d.b||'').replace(/</g,'&lt;')}</div></div>`
  ).join('');
  w_list.querySelectorAll('.term').forEach(t=>t.onclick=()=>t.closest('.item').classList.toggle('open'));
}
w_q.oninput=()=>wrender(w_q.value);
wrender('');

// ---- ПАМЯТЬ ФОРМЫ РАСЧЁТА ----
// Mini App закрывается по любому переходу в чат, и при повторном открытии форма была пустой:
// код, цену, Incoterms и страну приходилось вводить заново (тест 29.07.2026). Держим последний
// ввод в localStorage. Это черновик формы, не деньги и не доступ — состоянию бота не противоречит.
const FORM_KEY='ic_calc_form_v1';
const FORM_FIELDS=['c_q','c_price','c_inco','c_transport','c_ins','c_qty','c_wt','c_orig_q',
                   'c_orig','c_eng','c_age','c_uval','c_years'];
function formSave(){
  try{
    const d={};
    FORM_FIELDS.forEach(id=>{const el=document.getElementById(id); if(el&&el.value) d[id]=el.value});
    d.c_cert=c_cert.checked; d.picked=pickedCode||'';
    // Подпись чекбокса зависит от страны (СТ-1 / EUR.1 / Form A) и ставится при выборе из списка.
    // Список стран загружается асинхронно, поэтому проще сохранить готовую подпись, чем пересобирать.
    d.cert_l=c_cert_l.textContent||'';
    localStorage.setItem(FORM_KEY,JSON.stringify(d));
  }catch(e){/* приватный режим / нет квоты — молча живём без памяти */}
}
function formRestore(){
  // Ссылка из чата важнее сохранённого черновика: если в URL есть код, восстановление пропускаем,
  // иначе старый код перебил бы тот, который человек только что открыл в боте.
  if(params.get('code')) return;
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(FORM_KEY)||'null'); }catch(e){ d=null }
  if(!d) return;
  FORM_FIELDS.forEach(id=>{const el=document.getElementById(id); if(el&&d[id]!=null) el.value=d[id]});
  c_cert.checked=!!d.c_cert;
  if(d.picked){ pickedCode=d.picked; c_picked.textContent='Код: '+d.picked; }
  if(d.cert_l) c_cert_l.textContent=d.cert_l;
  incoUpd(); utilUpdate();
}
document.getElementById('pcalc').addEventListener('input',()=>formSave());
document.getElementById('pcalc').addEventListener('change',()=>formSave());
formRestore();

// ---- МОСТ ИЗ ЧАТА (deep-link): префилл кода и авто-запуск нужной вкладки ----
// ИИ в чате даёт ссылку вида ...?tab=perm&code=XXXX (или calc&code&price&qty&cert=1),
// пользователь открывает Mini App и сразу видит богатый разбор.
(function(){
  const dcode=(params.get('code')||'').replace(/\s/g,'');
  if(!dcode) return;
  const dtab=params.get('tab');
  if(dtab==='perm'){
    p_q.value=dcode; p_picked.textContent='Код: '+dcode; permLoad(dcode);
  } else if(dtab==='code'){
    k_q.value=dcode; k_q.dispatchEvent(new Event('input'));
  } else if(dtab==='calc'){
    pickedCode=dcode; c_q.value=dcode; c_picked.textContent='Код: '+dcode;
    const dp=params.get('price'); if(dp) c_price.value=dp;
    const dq=params.get('qty'); if(dq) c_qty.value=dq;
    if(params.get('cert')==='1') c_cert.checked=true;
    // Авто-запуск только если явно не запрещён (run=0): мост-калькулятор префилит поля,
    // но не запускает расчёт сам — чтобы не списать лишнюю попытку; пользователь жмёт сам.
    if(dp && params.get('run')!=='0') c_go.click();
  }
})();
</script>
